*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--am-bg); color: var(--am-ink); font-family: var(--am-sans);
       font-size: 15px; line-height: 1.5; overflow-x: hidden; }
.am-wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 40px; }
.am-embed .am-wrap { padding: 8px 4px 16px; }

/* top bar (hidden with ?embed=1) */
.am-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 14px 0;
          border-bottom: 1px solid var(--am-line); margin-bottom: 18px; }
.am-embed .am-top, .am-embed .am-h1, .am-embed .am-foot { display: none; }
.am-brand { font-weight: 700; font-size: 15px; color: var(--am-ink); text-decoration: none; }
.am-brand .am-iff { color: var(--am-accent); }
.am-logo { height: 20px; width: auto; vertical-align: -5px; margin-right: 7px; }
.am-page { font-size: 14px; color: var(--am-dim); }
.am-links { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
.am-links a { color: var(--am-dim); text-decoration: none; }
.am-links a:hover { color: var(--am-accent); text-decoration: underline; }
.am-theme { background: var(--am-sunken); border: 1px solid var(--am-line); border-radius: 999px;
            width: 34px; height: 34px; cursor: pointer; color: var(--am-ink); font: inherit; }

/* intro: title, the one-line hint, the kind legend */
.am-h1 { font-size: 26px; letter-spacing: -.015em; margin: 4px 0 4px; color: var(--am-heading); }
.am-hint { margin: 0 0 8px; max-width: none; font-size: 14px; color: var(--am-dim); }
.am-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 14px; padding: 0; max-width: none;
             list-style: none; font-size: 12.5px; color: var(--am-dim); }
.am-legend li { margin: 0; display: inline-flex; align-items: center; gap: 6px; }
.am-legend b { color: var(--am-ink); font-weight: 650; }

/* the stage: tiles on the left, the detail panel on the right (a sheet on a phone) */
.am-stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.am-stage.is-open { grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); }
.am-tiles { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.am-tile { display: grid; grid-template-columns: minmax(120px, 12rem) minmax(0, 1fr); gap: 6px 16px;
           background: var(--am-panel); border: 1px solid var(--am-line); border-radius: 12px;
           padding: 12px 14px; transition: opacity 150ms ease, border-color 150ms ease; }
.am-tile.is-zoom { border-color: var(--am-accent); box-shadow: 0 0 0 1px var(--am-accent); }
.am-tile.is-dim { opacity: .38; }
.am-tile-head { min-width: 0; }
.am-tile-title { display: inline-flex; align-items: baseline; gap: 8px; background: none; border: 0;
                 padding: 0; margin: 0; cursor: pointer; font: inherit; color: var(--am-heading);
                 font-weight: 800; font-size: 14px; letter-spacing: .07em; text-align: left; }
.am-tile-title:hover, .am-tile-title:focus-visible { color: var(--am-accent); }
.am-tile-title::after { content: "\203A"; color: var(--am-dim); font-weight: 400; }
.am-count { font-family: var(--am-mono); font-size: 11px; font-weight: 400; letter-spacing: 0;
            color: var(--am-dim); }
.am-blurb { margin: 4px 0 0; max-width: none; font-size: 12.5px; line-height: 1.45; color: var(--am-dim); }
.am-chips { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-width: 0; }
.am-empty { font-size: 12.5px; color: var(--am-dim); font-style: italic; }

/* chips: text-sized, wrap inside their row, never overflow it */
.am-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin: 0;
           font: inherit; font-size: 12.5px; line-height: 1.3; font-weight: 600; color: var(--am-ink);
           background: var(--am-sunken); border: 1px solid transparent; border-radius: 999px;
           padding: 3px 10px 3px 8px; cursor: pointer; text-align: left; overflow-wrap: anywhere;
           transition: opacity 150ms ease, border-color 150ms ease, box-shadow 150ms ease; }
.am-chip::before { content: ""; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
                   background: var(--am-k, var(--am-dim)); }
.am-chip:hover, .am-chip:focus-visible { border-color: var(--am-k, var(--am-line-strong)); outline: none; }
.k-agent { --am-k: var(--am-agent); --am-kt: var(--am-agent-t); }

.am-chip.k-agent, .am-chip.k-code, .am-chip.k-data, .am-chip.k-human { background: var(--am-kt); }
.am-chip.is-sel { border-color: var(--am-k); box-shadow: 0 0 0 2px var(--am-k); font-weight: 800; }
.am-chip.is-near { border-color: var(--am-k); }
.am-chip.is-dim { opacity: .28; }

/* the detail panel */
.am-panel { display: none; min-width: 0; background: var(--am-panel); border: 1px solid var(--am-line);
            border-radius: 12px; position: sticky; top: 12px; max-height: calc(100vh - 24px);
            overflow-y: auto; overscroll-behavior: contain; }

           letter-spacing: .08em; text-transform: uppercase; color: var(--am-k, var(--am-dim)); }
.am-kind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--am-k, var(--am-dim)); }
.am-ptitle { font-size: 20px; line-height: 1.25; letter-spacing: -.01em; margin: 2px 0 2px;

.am-id { font-family: var(--am-mono); font-size: 12px; color: var(--am-dim); margin: 0 0 12px;
         overflow-wrap: anywhere; }
.am-file { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0 0 14px;
           padding: 10px 12px; background: var(--am-sunken); border: 1px solid var(--am-line); border-radius: 10px; }
.am-path { font-family: var(--am-mono); font-size: 12.5px; background: none; border: 0; padding: 0;
           color: var(--am-ink); overflow-wrap: anywhere; word-break: break-word; }
.am-open { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700;
           font-size: 14px; border-radius: 9px; padding: 8px 14px; background: var(--am-accent);
           color: var(--am-bg); border: 1px solid var(--am-accent); }
.am-open:hover { opacity: .9; }
.am-note { margin: 0 0 12px; max-width: none; font-size: 13px; color: var(--am-dim); }
.am-note a { color: var(--am-accent); }
.am-note code { font-family: var(--am-mono); font-size: 12px; }
.am-desc { margin: 0 0 6px; max-width: none; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.am-desc.is-clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;

.am-more { background: none; border: 0; padding: 0; margin: 0 0 12px; font: inherit; font-size: 12.5px;

.am-foot { margin: 22px 0 0; max-width: none; font-size: 12.5px; color: var(--am-dim); }
.am-foot a { color: var(--am-accent); }
.am-foot code { font-family: var(--am-mono); font-size: 12px; }

@media (max-width: 720px) {
  .am-wrap { padding: 0 12px 28px; }

@media (prefers-reduced-motion: reduce) {
  .am-tile, .am-chip { transition: none; }
  .am-stage.is-open .am-panel { animation: none; }

ckctl","invokes"],["skill.adopt","tool.mapctl","invokes"],["skill.adopt","tool.consolectl","invokes"],["skill.adopt","tool.statectl","invokes"],["skill.adopt","agent.anatomist","invokes"],["skill.project-memory","store.project_log","writes"],["skill.project-memory","store.lessons","writes"],["skill.project-memory","tool.checkctl","invokes"],["skill.project-memory","tool.statectl","invokes"],["skill.project-memory","agent.anatomist","invokes"],["skill.project-memory","agent.retro-analyst","invokes"],["tool.checkctl","config.memory","reads"],["tool.checkctl","config.registry","reads"],["tool.checkctl","config.model-prices","reads"],["tool.checkctl","config.observe","reads"],["tool.checkctl","config.policy","reads"],["tool.checkctl","config.console","reads"],["tool.checkctl","config.phases","reads"],["tool.checkctl","store.journal","reads"],["tool.checkctl","store.heartbeat","reads"],["tool.checkctl","store.memory_run","reads"],["tool.checkctl","store.needs_human","reads"],["tool.checkctl","store.session","reads"],["tool.checkctl","store.ritual_ticket","reads"],["tool.checkctl","store.handshakes","reads"],["tool.checkctl","config.orchestration","reads"],["tool.checkctl","store.memory_run","writes"],["tool.checkctl","store.generators","writes"],["tool.checkctl","store.ritual_ticket","writes"],["tool.checkctl","tool.mapctl","invokes"],["tool.checkctl","tool.obsctl","invokes"],["tool.checkctl","tool.consolectl","invokes"],["tool.checkctl","tool.statectl","invokes"],["tool.checkctl","tool.graphctl","invokes"],["tool.distctl","store.cards","reads"],["tool.distctl","config.memory","reads"],["tool.distctl","config.publish","reads"],["tool.distctl","store.dist","writes"],["tool.distctl","tool.checkctl","invokes"],["skill.adhd","config.brainstorm","reads"],["tool._lib","config.policy","reads"],["tool._lib","config.observe","reads"],["tool._lib","config.registry","reads"],["tool._lib","store.journal","reads"],["tool._lib","store.machine","reads"],["tool._lib","store.handshakes","reads"],["tool._lib","store.orchestration","reads"],["tool._lib","config.orchestration","reads"],["tool._lib","store.journal","writes"],["tool._lib","store.record","writes"],["tool._lib","store.handshakes","writes"],["tool._lib","store.orchestration","writes"]],"layers":[{"blurb":"Durable project memory: status, decision log, lessons, tasks, research, reference.","id":"MEMORY","title":"MEMORY"},{"blurb":"Gates and contracts: policy enforcement, write validation, handshake envelopes, human gates.","id":"GOVERN","title":"GOVERN"},{"blurb":"The always-on record: capture, heartbeat, seal, rollup, anchor, token ledger, retrospective analysis.","id":"OBSERVE","title":"OBSERVE"},{"blurb":"One page of command and control: NOW, MAP, STORY, WORK.","id":"CONSOLE","title":"CONSOLE"},{"blurb":"The system changing itself on evidence: the ritual, retro proposals, the anatomist, pruning.","id":"EVOLVE","title":"EVOLVE"},{"blurb":"Components the anatomist has not yet placed into a flow layer. Visible by design.","id":"UNPLACED","title":"unplaced"}],"nodes":[{"description":"session-start.sh - the orientation hook. Its stdout is injected into the fresh session's context, which makes it the one place where \"where were we\" arrives without anyone asking. Three jobs, in order of importance: 1. Print the resume block (pointer, open loops, unfinished intents, SEV0/SEV1 counts), then one MODE/PHASE line; in the guided-solo and fableous-orchestrated modes also the current phase's contract (at most five lines, from config/phases.json). 2. Nudge the agent to ASK THE USER for the ritual when it has not run in a while (only the user can open it). The nudge lives HERE rather than on SessionEnd because SessionStart's stdout->context path is the one we can prove works. Sessions are counted from the capture lane's SessionStart events (spool + sealed segments), plus this one; with that capture off the count is unknown and the nudge says so and goes by age alone. 3. Optionally start the console server, guarded by a pidfile so N sessions start one server. Read-only with respect to project state: it never writes to the journal. In a linked worktree (_lib.worktree_info; a Cview worker) it prints a WORKTREE SESSION block instead and exits 0: no resume block, no ritual nudge, no console start. It also prints one CHECKOUT line (resolved root, record root, and a 'no sealed history' flag). It never blocks. The console autostart reads the pidfile and checks liveness through _lib.pid_alive, never os.kill(pid, 0) (which kills on Windows).","id":"hook.session-start","kind":"code","label":"session-start","layer":"MEMORY","path":".claude/hooks/session-start.sh","title":"Session Start","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/session-start.sh"},{"description":"Create and maintain resume-proof task files under .claude/tasks/. Invoke on \"plan this\", \"let's plan\", \"break this down\", or any task likely to span more than one session, AND on \"resume\", \"where were we\", \"continue the task\", \"pick up \u003ctask>\". NOT for trivial single-step asks that finish inside one exchange; those need no task file.","id":"skill.plan-task","kind":"code","label":"/plan-task","layer":"MEMORY","path":".claude/skills/plan-task/SKILL.md","title":"plan-task","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/skills/plan-task/SKILL.md"},{"description":"statectl.py - the continuity engine: journal in, projections out. Every tracked-state writer refuses inside a linked worktree with one line (_lib.main_state_guard). dispatch and accept refuse when .cview/ exists at the repo root (_cview_drives, _CVIEW_REFUSAL): Cview drives, not the lead.","id":"tool.statectl","kind":"code","label":"statectl","layer":"MEMORY","path":".claude/tools/statectl.py","title":"Statectl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/statectl.py"},{"box":".claude/config/","description":"The ritual registry: which steps /project-memory runs, in which phase, in order.","id":"config.memory","kind":"data","label":"memory","layer":"MEMORY","path":".claude/config/memory.json","title":"Memory","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/memory.json"},{"description":"The three mechanisms that keep home-repo-only content out of the adoption kits (structural placement outside .claude/, the distribution.enabled knob, distctl content normalization) and the decision rule for picking one.","id":"reference.distribution-boundary","kind":"data","label":"distribution-boundary","layer":"MEMORY","path":".claude/reference/distribution-boundary.md","title":"Distribution Boundary","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/reference/distribution-boundary.md"},{"box":".claude/state/","description":"Derived human-readable resume note, projected from the journal.","id":"store.handoff","kind":"data","label":"handoff","layer":"MEMORY","local":true,"path":".claude/state/HANDOFF.md","title":"Handoff note","url":null},{"box":".claude/state/","description":"Append-only truth: one action vocabulary, shared by every writer and the projector.","id":"store.journal","kind":"data","label":"journal","layer":"MEMORY","path":".claude/state/journal.jsonl","title":"Journal","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/journal.jsonl"},{"description":"Mistakes distilled into mechanical prevention rules, rendered in console WORK.","id":"store.lessons","kind":"data","label":"lessons","layer":"MEMORY","path":".claude/LESSONS.jsonl","title":"Lessons","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/LESSONS.jsonl"},{"box":".claude/state/","description":"Device identity: a salted fingerprint (sha256 of user|host, truncated to 12 hex chars) plus a human-chosen alias. No username or hostname is stored. Single writer: `statectl.py device`; the session-start hook only reads and nags via `_lib.machine_check()`.","id":"store.machine","kind":"data","label":"machine","layer":"MEMORY","path":".claude/state/machine.json","title":"Machine identity","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/machine.json"},{"description":"Append-only decision/deliverable/milestone/mistake/tooling log.","id":"store.project_log","kind":"data","label":"project_log","layer":"MEMORY","path":".claude/Project-log.jsonl","title":"Project log","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/Project-log.jsonl"},{"box":".claude/state/","description":"Derived point-in-time session snapshot, projected from the journal.","id":"store.session","kind":"data","label":"session","layer":"MEMORY","local":true,"path":".claude/state/session.json","title":"Session snapshot","url":null},{"description":"Implements ONE task card (a .claude/tasks/ file with a Definition of done and one Test command) inside a git worktree the lead created, in the fableous-orchestrated mode. Use when the lead dispatches a task with a filled builder brief and a worktree name. Writes code and tests in its worktree only, never commits, and hands back a validated JSON envelope. NOT for planning, research, review or merging.","id":"agent.builder","kind":"agent","label":"builder","layer":"GOVERN","path":".claude/agents/builder.md","title":"builder","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/agents/builder.md"},{"box":"other (8)","description":"Read-only researcher for the lead in the fableous-orchestrated mode - codebase surveys, \"where is X and who calls it\", docs and web lookups, a quick check of one fact. Returns findings with exact paths and line numbers, cheaply, so the lead's context stays for decisions. Never edits anything. NOT for implementing (builder) and NOT for checking a finished task (verifier).","id":"agent.scout","kind":"agent","label":"scout","layer":"GOVERN","path":".claude/agents/scout.md","title":"scout","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/agents/scout.md"},{"box":"other (8)","description":"Adversarial quality-check agent. Given a claim, a deliverable, or done-criteria, independently verify it against reality (run tests, read outputs, recompute numbers) and return a verdict as a handshake envelope. Use after substantial work products, before reporting \"done\" on multi-step tasks, or whenever a skill's QC step calls for independent verification. NOT for producing or fixing work, it only checks.","id":"agent.verifier","kind":"agent","label":"verifier","layer":"GOVERN","path":".claude/agents/verifier.md","title":"verifier","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/agents/verifier.md"},{"description":"handoff-guard.sh - SubagentStart / SubagentStop, fableous-orchestrated mode only. SubagentStart: records when the agent began (state/orchestration.json) and resets the lead's delegation-nudge counter, because a dispatch is exactly what the nudge asks for. SubagentStop: a `builder` that is stopping without a valid handoff envelope written since it started, for an open builder stub, is sent back ONCE to write it ({\"decision\": \"block\", \"reason\": ...}, the documented Stop/SubagentStop blocking output). When the harness says stop_hook_active (this stop was already sent back once), the builder stops: the hook can never loop. Every other agent type stops untouched. BEST EFFORT, on purpose. The payload fields read here (hook_event_name, agent_type, agent_id, agent_transcript_path, stop_hook_active) are what the harness sends today and may change; a missing field reads as \"cannot tell\" and the agent stops normally. The HARD guarantee is not this hook: it is `statectl task \u003cid> --status done`, which in fableous-orchestrated refuses without a valid envelope whose tests passed. LAW 2, telemetry half: FAILS OPEN. A malformed payload, a missing python3 or any internal error means no output and exit 0. In freestyle and guided-solo it does nothing at all. The payload goes through a temp file, not an environment variable: a SubagentStop payload can carry the agent's whole last message, and an env string is capped (see policy-gate.sh).","id":"hook.handoff-guard","kind":"code","label":"handoff-guard","layer":"GOVERN","path":".claude/hooks/handoff-guard.sh","title":"Handoff Guard","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/handoff-guard.sh"},{"description":"policy-gate.sh - PreToolUse gate on Write|Edit|NotebookEdit|Bash. LAW 2, gate half: THIS HOOK FAILS CLOSED. If the policy file is unreadable or malformed, writes under the hardcoded fallback tree are DENIED and everything else is allowed - a broken policy can neither expose the protected tree nor brick the whole session. Two rings: 1. The record (RECORD_ROOT and .claude-iff/) is write-denied to EVERY identity, including the main session. It is written only by the capture hook's append and by obsctl. This is what \"append-only\" actually rests on; the committed anchor is what makes it evidence. 2. The protected tree (.claude/hooks, config, agents, protocols, settings) is main-session only. A sub-agent must never be able to edit the gate that polices it or the ritual registry it runs under. Identity comes from the payload's agent_type/agent_name; absent means the main session. A third identity, the worker (main identity whose root is a linked worktree, _lib.worktree_info): its own git and protected-tree copy stay allowed, statectl dispatch/accept are refused. A 'wstate' ring guards .claude/state/ of worktree copies (handshakes/ carved out) for every identity.","id":"hook.policy-gate","kind":"code","label":"policy-gate","layer":"GOVERN","path":".claude/hooks/policy-gate.sh","title":"Policy Gate","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/policy-gate.sh"},{"description":"post-write-validate.sh - PostToolUse gate on Write|Edit. The generic GOVERN gate. LAW 2, gate half: FAILS CLOSED. A structured file under .claude/ that no longer parses is blocked on the spot (exit 2, message to the model) so the agent fixes its own bad write while it still has the context - rather than the corruption surfacing three sessions later when the console silently renders nothing. Deliberately narrow: it parse-checks JSON/JSONL and the handshake envelope's required keys. Deep semantic validation belongs to project-registered CHECK steps, not to a per-write hook that runs under a timeout on every edit. The lead advisories (delegate, progress block) are skipped in a linked worktree (_lib.worktree_info), which is a worker, not the lead.","id":"hook.post-write-validate","kind":"code","label":"post-write-validate","layer":"GOVERN","path":".claude/hooks/post-write-validate.sh","title":"Post Write Validate","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/post-write-validate.sh"},{"description":"ritual-ticket.sh - UserPromptSubmit + UserPromptExpansion hook. Mints the ritual ticket. The ritual (/project-memory) and the installer (/adopt) are the USER's to open. checkctl refuses to open, continue or complete a ritual run without a fresh ticket in .claude/state/ritual-ticket.json, and the policy gate denies that file to every agent identity on every write lane. This hook is its one writer: when the user's own prompt starts with /project-memory or /adopt (UserPromptSubmit `user_input`, `prompt` in older releases), or Claude Code expands one of those two commands (UserPromptExpansion `command_name`), it writes {skill, ts, session_id, event}. A prompt that merely mentions the command mid-sentence writes nothing, and neither does a turn Claude Code starts on its own. A tripwire, not cryptography: an agent-opened ritual fails loudly, and every issue lands in the record. It does not make forging impossible. NEVER blocks or alters the prompt: every path exits 0 and prints nothing (stdout on these two events would be injected into the context). If it breaks, no ticket is written and checkctl refuses the ritual: fail closed overall, through checkctl, never by blocking the user here. The payload goes to a temp FILE, as in policy-gate.sh: a prompt can be far larger than an environment variable may hold.","id":"hook.ritual-ticket","kind":"code","label":"ritual-ticket (hook)","layer":"GOVERN","path":".claude/hooks/ritual-ticket.sh","title":"Ritual Ticket","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/ritual-ticket.sh"},{"box":".claude/config/","description":"Lead-and-team routing in the fableous-orchestrated mode (.claude/protocols/orchestration.md).","id":"config.orchestration","kind":"data","label":"orchestration (config)","layer":"GOVERN","path":".claude/config/orchestration.json","title":"Orchestration","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/orchestration.json"},{"box":".claude/config/","description":"The lifecycle phases (plan -> build -> review -> deploy): what work each phase allows, and the check that must pass to leave it.","id":"config.phases","kind":"data","label":"phases","layer":"GOVERN","path":".claude/config/phases.json","title":"Phases","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/phases.json"},{"box":".claude/config/","description":"Access policy enforced by hooks/policy-gate.sh (PreToolUse on Write|Edit|NotebookEdit|Bash).","id":"config.policy","kind":"data","label":"policy","layer":"GOVERN","path":".claude/config/policy.json","title":"Policy","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/policy.json"},{"box":".claude/config/","description":"What distctl.py export may publish from .claude/ and .claude-iff/ into a clean public copy: an include list of globs that can only narrow a hard-coded floor (state, logs, lessons, status, tasks, research, the record surface, local settings and env files never export). Kits ship it empty.","id":"config.publish","kind":"data","label":"publish","layer":"GOVERN","path":".claude/config/publish.json","title":"Publish","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/publish.json"},{"description":"Evolution: how .claude changes. ## Principle `.claude` is a living system: the project teaches it what it needs.","id":"protocol.evolution","kind":"data","label":"evolution","layer":"GOVERN","path":".claude/protocols/evolution.md","title":"Evolution: how .claude changes","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/protocols/evolution.md"},{"box":"other (8)","description":"Handshake protocol: agent to agent contracts. How a spawning agent (the parent) and a subagent exchange work without losing information.","id":"protocol.handshake","kind":"data","label":"handshake","layer":"GOVERN","path":".claude/protocols/handshake.md","title":"Handshake protocol: agent to agent contracts","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/protocols/handshake.md"},{"box":"other (8)","description":"Honesty: the working agreement. The rest of `.claude/` assumes the information flowing through it is true: the Project log is only as good as the reports behind it, the retro can only fix friction it hears about, and the developer can only make good calls on accurate status.","id":"protocol.honesty","kind":"data","label":"honesty","layer":"GOVERN","path":".claude/protocols/honesty.md","title":"Honesty: the working agreement","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/protocols/honesty.md"},{"box":"other (8)","description":"Human gates: when to wait, when to proceed. You constantly face the choice: ask the human, or keep moving.","id":"protocol.human-gates","kind":"data","label":"human-gates","layer":"GOVERN","path":".claude/protocols/human-gates.md","title":"Human gates: when to wait, when to proceed","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/protocols/human-gates.md"},{"box":"other (8)","description":"Orchestration protocol: the lead and its team. How work is split in the `fableous-orchestrated` mode: the top model plans, designs and stays accountable; cheaper agents build and research; every handoff is a JSON envelope that is checked by code, not by trust.","id":"protocol.orchestration","kind":"data","label":"orchestration (protocol)","layer":"GOVERN","path":".claude/protocols/orchestration.md","title":"Orchestration protocol: the lead and its team","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/protocols/orchestration.md"},{"box":"other (8)","description":"The recommended pattern: work with the agent in a private repo, publish releases to a public repo with distctl.py export. What the record is and why it never leaves, what visibility tracked vs ignored means for a team, the exact commands, and that the export never commits or pushes.","id":"reference.public-private","kind":"data","label":"public-private","layer":"GOVERN","path":".claude/reference/public-private.md","title":"Public and private","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/reference/public-private.md"},{"box":"other (8)","description":"Where each kind of key belongs (tool keys in the env block of .claude/settings.local.json, MCP keys via claude mcp add --env or ${VAR} in .mcp.json), what never goes in git, and how the secrets_placement check and checkctl doctor enforce it.","id":"reference.secrets","kind":"data","label":"secrets","layer":"GOVERN","path":".claude/reference/secrets.md","title":"Secrets","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/reference/secrets.md"},{"box":".claude/state/","description":"Agent-to-agent Structured Return envelopes (stub at dispatch, envelope at delivery).","id":"store.handshakes","kind":"data","label":"handshakes","layer":"GOVERN","path":".claude/state/handshakes","title":"Handshake envelopes","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/handshakes"},{"box":".claude/state/","description":"Async needs-human queue: SEV0-3 bands, queue-as-view. Bundles the append-only source (needs-human.jsonl) and its derived projection (needs-human.json).","id":"store.needs_human","kind":"data","label":"needs_human","layer":"GOVERN","path":".claude/state/needs-human.jsonl","title":"Needs-human queue","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/needs-human.jsonl"},{"box":".claude/state/","description":"fableous-orchestrated runtime, per machine and gitignored: when each sub-agent began (the builder stop check's 'since'), the lead's code edits since the last dispatch (the delegation nudge), and when the periodic progress report last went to the lead (both organised modes). Written by the hooks only.","id":"store.orchestration","kind":"data","label":"orchestration (store)","layer":"GOVERN","local":true,"path":".claude/state/orchestration.json","title":"Orchestration runtime","url":null},{"box":".claude/state/","description":"Ideas out of scope right now (statectl proposal add/list/resolve, ids PR-\u003cn>): append-only, its own store like needs-human so a parked idea outlives any session. Open count lands in session.json; listed on the console WORK tab.","id":"store.proposals","kind":"data","label":"proposals","layer":"GOVERN","path":".claude/state/proposals.jsonl","title":"Proposal box","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/proposals.jsonl"},{"box":".claude/state/","description":"Proof the USER typed /project-memory or /adopt: {skill, ts, session_id, event}. Written by the prompt hook, or by `checkctl ticket --grant` that the human runs in their own terminal (the gate denies the file and that subcommand to every agent); checked by checkctl run and complete, consumed by complete. A tripwire, not cryptography; gitignored.","id":"store.ritual_ticket","kind":"data","label":"ritual_ticket (store)","layer":"GOVERN","local":true,"path":".claude/state/ritual-ticket.json","title":"Ritual ticket","url":null},{"description":"heartbeat.sh - Stop hook. One O(1) overwrite of state/heartbeat.json per turn. This is a LIVENESS signal, not the resume guarantee. A usage-limit cutoff or a crash in the middle of a turn never fires Stop, so the thing that actually survives is the pointer written to the journal BEFORE the risky operation. Say it here because the file's name invites the opposite assumption. Overwrite, not append: the journal stays small and meaningful, and the console gets a freshness number for free. In a linked worktree with TASK.md and neither DONE.md nor BLOCKED.md, it also emits one advisory systemMessage line (never a block; fails open).","id":"hook.heartbeat","kind":"code","label":"heartbeat (hook)","layer":"OBSERVE","path":".claude/hooks/heartbeat.sh","title":"Heartbeat","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/heartbeat.sh"},{"description":"obs-capture.sh - the capture lane. Appends the raw hook payload to the out-of-repo spool. LAW 2, telemetry half: THIS HOOK FAILS OPEN, ALWAYS. Every path through it exits 0, every exception is swallowed. A broken observatory must never break the agent loop - an unwritable record root, a full disk, or a malformed payload costs us an event, never the session. LAW 3: what lands here is VERBATIM (prompts, file contents, tool output). That is why the spool lives in RECORD_ROOT, outside the repo and outside git, and why sealing redacts through an allowlist before anything reaches a committed surface. Wired to the lean event set by default (see .claude/config/observe.json); the payload is passed through an env var because the python heredoc below claims stdin.","id":"hook.obs-capture","kind":"code","label":"obs-capture","layer":"OBSERVE","path":".claude/hooks/obs-capture.sh","title":"Obs Capture","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/hooks/obs-capture.sh"},{"description":"","id":"tool.obsctl","kind":"code","label":"obsctl","layer":"OBSERVE","path":".claude/tools/obsctl.py","title":"Obsctl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/obsctl.py"},{"box":".claude/config/","description":"MAINTAINER-VERIFIED PRICES ONLY.","id":"config.model-prices","kind":"data","label":"model-prices","layer":"OBSERVE","path":".claude/config/model-prices.json","title":"Model Prices","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/model-prices.json"},{"box":".claude/config/","description":"Observability settings.","id":"config.observe","kind":"data","label":"observe","layer":"OBSERVE","path":".claude/config/observe.json","title":"Observe","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/observe.json"},{"box":".claude-iff/","description":"SHA-256 chain over sealed segments; tamper evidence for the record.","id":"store.anchor","kind":"data","label":"anchor","layer":"OBSERVE","path":".claude-iff/obs/anchor.json","title":"Seal anchor","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude-iff/obs/anchor.json"},{"box":".claude/state/","description":"Liveness signal, overwritten once per turn by the Stop hook ('turn ended') and mid-turn by the activity pulse ('working', via the policy gate and the sub-agent capture lane, throttled by progress.pulse_seconds). Not the resume guarantee - the journal pointer is.","id":"store.heartbeat","kind":"data","label":"heartbeat (store)","layer":"OBSERVE","local":true,"path":".claude/state/heartbeat.json","title":"Heartbeat","url":null},{"box":"record root","description":"RECORD_ROOT: raw capture, sealed raw, segments, transcripts, analysis, vault - sibling folder, out of git.","id":"store.record","kind":"data","label":"record","layer":"OBSERVE","path":null,"title":"Record root","url":null},{"box":".claude-iff/","description":"Daily allowlisted totals only, committed in-repo (the iff test).","id":"store.rollups","kind":"data","label":"rollups","layer":"OBSERVE","path":".claude-iff/obs/rollups","title":"Daily rollups","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude-iff/obs/rollups"},{"box":".claude/state/","description":"Dual-clock narrative feed: operations & errors, anatomy evolution, data evolution.","id":"store.story","kind":"data","label":"story","layer":"OBSERVE","path":".claude/state/story-feed.json","title":"Story feed","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/story-feed.json"},{"description":"console.py - hardened stdlib HTTP server for the console.","id":"console.server","kind":"code","label":"server","layer":"CONSOLE","path":".claude/console/console.py","title":"Console Server","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/console/console.py"},{"description":"consolectl.py - build the console payload, render it into console.html, delegate to the live server, or stop the server session-start launched (its pidfile lives in the record root) so the repo folder is free to delete or move.","id":"tool.consolectl","kind":"code","label":"consolectl","layer":"CONSOLE","path":".claude/tools/consolectl.py","title":"Consolectl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/consolectl.py"},{"description":"ctxmap.py - folder context: which guides and rules Claude Code loads for a file, and whether that context is healthy.","id":"tool.ctxmap","kind":"code","label":"ctxmap","layer":"CONSOLE","path":".claude/tools/ctxmap.py","title":"Ctxmap","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/ctxmap.py"},{"description":"graphctl.py - the code graph: files, classes, functions and the edges between them.","id":"tool.graphctl","kind":"code","label":"graphctl","layer":"CONSOLE","path":".claude/tools/graphctl.py","title":"Graphctl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/graphctl.py"},{"description":"mapctl.py - the anatomy tool: scan stubs cards, lint checks the map, compile builds the node/edge map, context audits guides and rules, architecture renders the code graph, anatomy reads the map, cards, layers, architecture.json and console.anatomy-template and renders the docs site's interactive anatomy page; its output docs/anatomy.html is a docs artifact, not a store. cap_boxes marks a fold whose members are all lazy as lazy.","id":"tool.mapctl","kind":"code","label":"mapctl","layer":"CONSOLE","path":".claude/tools/mapctl.py","title":"Mapctl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/mapctl.py"},{"description":"progress.py - the progress model: one computation, three renderings.","id":"tool.progress","kind":"code","label":"progress","layer":"CONSOLE","path":".claude/tools/progress.py","title":"Progress","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/progress.py"},{"description":"sysmon.py - optional system-monitor probes: CPU, RAM, GPU/VRAM.","id":"tool.sysmon","kind":"code","label":"sysmon","layer":"CONSOLE","path":".claude/tools/sysmon.py","title":"Sysmon","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/sysmon.py"},{"box":".claude/config/","description":"Console serving.","id":"config.console","kind":"data","label":"console","layer":"CONSOLE","path":".claude/config/console.json","title":"Console","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/console.json"},{"description":"HTML shell of the docs site's anatomy page (layers, one component, its file), kept in CONSOLE as a sibling of the console's own template; read by tool.mapctl anatomy, which fills one JSON token and writes docs/anatomy.html (a docs artifact).","id":"console.anatomy-template","kind":"data","label":"anatomy-template","layer":"CONSOLE","path":".claude/console/anatomy.template.html","title":"Anatomy Template","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/console/anatomy.template.html"},{"description":"The console's single HTML shell (head, theme, styles, tabs) with one JSON token replaced by consolectl's payload at build time.","id":"console.template","kind":"data","label":"template","layer":"CONSOLE","path":".claude/console/console.template.html","title":"Console Template","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/console/console.template.html"},{"box":".claude/system-map/","description":"Layer registry.","id":"map.layers","kind":"data","label":"layers","layer":"CONSOLE","path":".claude/system-map/layers.json","title":"Map Layers","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/system-map/layers.json"},{"box":".claude/system-map/","description":"The architecture diagram's spec, one scope per diagram (groups, boxes, arrows), written by mapctl architecture with docs/ARCHITECTURE.md rendered from it.","id":"store.architecture","kind":"data","label":"architecture","layer":"CONSOLE","path":".claude/system-map/architecture.json","title":"Architecture spec","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/system-map/architecture.json"},{"box":".claude/system-map/","description":"One JSON card per component; the system map's own source of truth.","id":"store.cards","kind":"data","label":"cards","layer":"CONSOLE","path":".claude/system-map/cards","title":"Cards","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/system-map/cards"},{"box":".claude/system-map/","description":"The normalised code graph (files, classes, functions; contains, imports, calls), written by graphctl build from graphify's output under the record root or the stdlib walker. Gitignored: machine-local, rebuilt by the ritual, never shipped; mapctl architecture collapses it into the code scopes of the architecture spec.","id":"store.code_graph","kind":"data","label":"code_graph","layer":"CONSOLE","local":true,"path":".claude/system-map/code-graph.json","title":"Code graph","url":null},{"box":".claude/system-map/","description":"Compiled system map: nodes, edges, and lint results, rendered by the console MAP tab.","id":"store.map","kind":"data","label":"map","layer":"CONSOLE","path":".claude/system-map/map.json","title":"System map","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/system-map/map.json"},{"description":"The .claude anatomy expert. Use PROACTIVELY from /project-memory whenever a session added, removed, renamed or repurposed a component (anything under .claude/, a tool, a store, a hook, a skill, an agent), and from /adopt as the final install step. It keeps .claude/system-map/cards/ truthful, places components into layers, audits folder health, implements approved evolution changes with the right primitive, and proposes pruning. NOT a code reviewer and NOT a general refactorer.","id":"agent.anatomist","kind":"agent","label":"anatomist","layer":"EVOLVE","path":".claude/agents/anatomist.md","title":"anatomist","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/agents/anatomist.md"},{"description":"End-of-session analyst invoked by the project-memory skill's EVOLVE step (soft gear). Receives a session digest plus the current .claude inventory and proposes only-necessary changes to the project's .claude system, including demotions and archivals, per .claude/protocols/evolution.md. Use PROACTIVELY only from project-memory, not a general reviewer of code, docs, or work products.","id":"agent.retro-analyst","kind":"agent","label":"retro-analyst","layer":"EVOLVE","path":".claude/agents/retro-analyst.md","title":"retro-analyst","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/agents/retro-analyst.md"},{"description":"Install the dot-claude-iff system into a target project, or upgrade an already-installed one. Invoke on \"adopt this system into \u003cpath>\", \"set up my project like this\", \"install the claude system\", \"bootstrap .claude for \u003cproject>\", or \"/adopt --upgrade\" to bring an installed project's system up to date. A rare, high-blast-radius operation: runs only when the user explicitly asks for it. A Line endings (.gitattributes) step precedes the visibility step; the CLAUDE.template.md worker section says never open the ritual from a worktree and never stage or commit under the state folder.","id":"skill.adopt","kind":"code","label":"/adopt","layer":"EVOLVE","path":".claude/skills/adopt/SKILL.md","title":"adopt","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/skills/adopt/SKILL.md"},{"description":"The one ritual - check, polish, publish, evolve, then route the next session (phase, mode, optional maturation pass). Only the user opens it, by typing /project-memory at the end of a working session or after a milestone. When the user says \"update memory\", \"log this session\", \"update the log\", \"curate memory\", \"update status\", \"wrap up\", or \"run the ritual\", ask them to type /project-memory. NOT for planning or resuming work (use /plan-task), and NOT for a cold \"where were we\" (read .claude/STATUS.md).","id":"skill.project-memory","kind":"code","label":"/project-memory","layer":"EVOLVE","path":".claude/skills/project-memory/SKILL.md","title":"project-memory","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/skills/project-memory/SKILL.md"},{"description":"checkctl.py - the ritual runner: CHECK, POLISH, PUBLISH mechanics for /project-memory. In a linked worktree run/complete are refused; check_changelog_parity also checks CITATION.cff against the version (citation_version); DERIVED_STATE_IGNORED lists projections kept out of the dirty-tree test. The doctor has a gitattributes row: WARN when no eol=lf rule covers the hooks.","id":"tool.checkctl","kind":"code","label":"checkctl","layer":"EVOLVE","path":".claude/tools/checkctl.py","title":"Checkctl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/checkctl.py"},{"description":"distctl.py - build the distribution zips, write the managed .gitignore block, and export a clean public copy. The managed ignore block ignores session.json, HANDOFF.md and needs-human.json; LEGAL_FILES (LICENSE, NOTICE) ship inside .claude/ of both kits. A GITATTRIBUTES constant (eol=lf rules) ships at both kits' roots, and the managed .gitignore block also ignores .cview/ in both visibilities.","id":"tool.distctl","kind":"code","label":"distctl","layer":"EVOLVE","path":".claude/tools/distctl.py","title":"Distctl","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/distctl.py"},{"box":".claude/config/","description":"The knob registry: one card per tunable, so every setting is discoverable, typed and documented in one place - including every agent's model and effort pin, which would otherwise hide in frontmatter and drift.","id":"config.registry","kind":"data","label":"registry","layer":"EVOLVE","path":".claude/config/registry.json","title":"Registry","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/registry.json"},{"description":"The two release artifacts: dot-claude-iff-fresh.zip (new repo) and dot-claude-iff-adopt-kit.zip (existing repo). Derived: rebuilt by the ritual and by the release step; equal to a rebuild on main and on every tag, while between releases the copies on dev may lag. Never a builder's.","id":"store.dist","kind":"data","label":"dist","layer":"EVOLVE","path":".claude/dist","title":"distribution zips","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/dist"},{"box":".claude/state/","description":"Law-1 anti-rot ledger: content hash of each generator's inputs/output, stamped after it runs through the ritual.","id":"store.generators","kind":"data","label":"generators","layer":"EVOLVE","path":".claude/state/generators.json","title":"Generator ledger","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/generators.json"},{"box":".claude/state/","description":"The /project-memory transaction: run id, phase, step, and who opened it (invoked_by: user-ticket, with the ticket's ts). PUBLISH refuses unless POLISH completed in the same run id.","id":"store.memory_run","kind":"data","label":"memory_run","layer":"EVOLVE","path":".claude/state/memory-run.json","title":"Ritual run checkpoint","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/state/memory-run.json"},{"description":"Parallel divergent ideation - isolated branches under different cognitive frames, then a separate critic pass that clusters, flags traps and shortlists. User-invoked only (/adhd), because one run costs about ten agent calls. For an open, divergent question (architecture, public API or SDK surface, schema, naming a real product, a fuzzy bug with no known root cause) you may SUGGEST \"/adhd \u003cproblem>\" in one line; never run it unasked. Not for lookups, syntax, bugs with a known root cause, or asks phrased \"quick\", \"just\", \"standard\" or \"textbook\". UPSTREAM.md documents the branch model as our own choice.","id":"skill.adhd","kind":"code","label":"/adhd","layer":"UNPLACED","path":".claude/skills/adhd/SKILL.md","title":"adhd","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/skills/adhd/SKILL.md"},{"description":"_lib.py - shared foundation for the dot-claude-iff tools. Worktree awareness: worktree_info (the one linked-worktree detector), main_checkout, main_state_guard (refuses tracked-state writes in a worktree), worker_task; the record root anchors at the main checkout. pid_alive(pid) is the cross-platform process liveness probe (ctypes on win32, signal 0 elsewhere).","id":"tool._lib","kind":"code","label":"_lib","layer":"UNPLACED","path":".claude/tools/_lib.py","title":"Lib","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/tools/_lib.py"},{"box":".claude/config/","description":"Brainstorm tuning for the /adhd skill: how many isolated branches diverge, which frames they pick from, and which model runs each phase.","id":"config.brainstorm","kind":"data","label":"brainstorm","layer":"UNPLACED","path":".claude/config/brainstorm.json","title":"Brainstorm","url":"https://github.com/Sdamirsa/dot-claude-iff/blob/main/.claude/config/brainstorm.json"},{"description":"The project maintainer: approves gates, reviews evolution proposals, owns publish/push decisions.","id":"human.maintainer","kind":"human","label":"maintainer","layer":"UNPLACED","path":null,"title":"Maintainer","url":null}],"project":"dot-claude-iff","v":1}</script>
<script>
(function () {
  "use strict";
  var THEME_KEY = "iff-docs-theme";
  var HASH_NODE = "#node=";
  var HASH_LAYER = "#layer=";
  var SHEET_QUERY = "(max-width: 720px)";
  var KIND_NAMES = { agent: "Agents", code: "Code", data: "Data", human: "Human" };
  var KIND_ORDER = ["agent", "code", "data", "human"];
  // [relation type, heading, direction]: "out" is what this card declares, "in" what declares it.
  var RELATIONS = [["reads", "Reads", "out"], ["writes", "Writes", "out"], ["invokes", "Invokes", "out"],
                   ["reads", "Read by", "in"], ["writes", "Written by", "in"], ["invokes", "Invoked by", "in"]];
  var root = document.documentElement;
  var stage = document.getElementById("am-stage");
  var tilesEl = document.getElementById("am-tiles");
  var panel = document.getElementById("am-panel");
  var crumbsEl = document.getElementById("am-crumbs");
  var bodyEl = document.getElementById("am-body");
  var footEl = document.getElementById("am-foot");

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] !== null && attrs[k] !== undefined) {
          if (k === "className") node.className = attrs[k];
          else node.setAttribute(k, attrs[k]);
        }
      }
    }
    (kids || []).forEach(function (kid) {
      if (kid === null || kid === undefined) return;
      node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return node;
  }

  // ------------------------------------------------------------------ theme (the docs site's key)
  function initTheme() {
    var btn = document.getElementById("am-theme");
    if (btn) {
      btn.addEventListener("click", function () {
        var cur = root.getAttribute("data-theme");
        var next = cur === "dark" ? "light" : cur === "light" ? "dark"
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });
    }
    // Embedded in the landing page: follow its toggle (same origin, so the storage event fires here).
    window.addEventListener("storage", function (e) {
      if (e.key === THEME_KEY && (e.newValue === "light" || e.newValue === "dark")) {
        root.setAttribute("data-theme", e.newValue);
      }
    });
  }

  // ------------------------------------------------------------------ data
  var DATA = null;
  try { DATA = JSON.parse(document.getElementById("am-data").textContent); } catch (e) { DATA = null; }
  initTheme();
  if (!DATA || !Array.isArray(DATA.nodes) || !Array.isArray(DATA.layers)) {
    tilesEl.appendChild(el("p", { className: "am-note" },
      ["The map data is missing or unreadable. Rebuild it: python3 .claude/tools/mapctl.py anatomy"]));
    return;
  }

  var layers = {}, layerOrder = [], nodes = {}, order = [], outRel = {}, inRel = {};
  DATA.layers.forEach(function (l) {
    if (l && l.id && !layers[l.id]) { layers[l.id] = l; layerOrder.push(l.id); }
  });
  if (!layers.UNPLACED) {
    layers.UNPLACED = { id: "UNPLACED", title: "unplaced", blurb: "" };
    layerOrder.push("UNPLACED");
  }
  DATA.nodes.forEach(function (n) {
    if (!n || !n.id || nodes[n.id]) return;
    if (!layers[n.layer]) n.layer = "UNPLACED";
    if (!KIND_NAMES[n.kind]) n.kind = "data";
    nodes[n.id] = n;
    order.push(n.id);
    outRel[n.id] = { reads: [], writes: [], invokes: [] };
    inRel[n.id] = { reads: [], writes: [], invokes: [] };
  });
  (DATA.edges || []).forEach(function (e) {
    // Self-check: a relation to a component the page does not carry is dropped, never drawn.
    if (!Array.isArray(e) || !nodes[e[0]] || !nodes[e[1]] || e[0] === e[1] || !outRel[e[0]][e[2]]) return;
    if (outRel[e[0]][e[2]].indexOf(e[1]) === -1) outRel[e[0]][e[2]].push(e[1]);
    if (inRel[e[1]][e[2]].indexOf(e[0]) === -1) inRel[e[1]][e[2]].push(e[0]);
  });

  function neighbours(id) {
    var seen = {};
    ["reads", "writes", "invokes"].forEach(function (t) {
      outRel[id][t].forEach(function (x) { seen[x] = true; });
      inRel[id][t].forEach(function (x) { seen[x] = true; });
    });
    return seen;
  }

  function membersOf(layerId) {
    return order.filter(function (id) { return nodes[id].layer === layerId; });
  }

  // ------------------------------------------------------------------ level 1: the anatomy
  var chipEls = {}, tileEls = {};

  function chip(id) {
    var n = nodes[id];
    return el("button", { type: "button", className: "am-chip k-" + n.kind, "data-id": id,
                          title: (n.title || id) + " (" + id + ")" }, [n.label || id]);
  }

  function renderTiles() {
    layerOrder.forEach(function (lid) {
      var l = layers[lid], members = membersOf(lid);
      var chips = el("div", { className: "am-chips" });
      members.forEach(function (id) {
        var c = chip(id);
        c.setAttribute("aria-pressed", "false");
        chipEls[id] = c;
        chips.appendChild(c);
      });
      if (!members.length) chips.appendChild(el("span", { className: "am-empty" }, ["none yet"]));
      var head = el("div", { className: "am-tile-head" }, [
        el("button", { type: "button", className: "am-tile-title", "data-layer": lid,
                       title: "Zoom into " + (l.title || lid) }, [
          l.title || lid, el("span", { className: "am-count" }, [String(members.length)])]),
        l.blurb ? el("p", { className: "am-blurb" }, [l.blurb]) : null
      ]);
      var tile = el("div", { className: "am-tile", id: "layer-" + lid }, [head, chips]);
      tileEls[lid] = tile;
      tilesEl.appendChild(tile);
    });
  }

  // ------------------------------------------------------------------ state, hash, history
  var state = { layer: null, node: null };

  function normalise(next) {
    if (next && next.node && nodes[next.node]) return { layer: nodes[next.node].layer, node: next.node };
    if (next && next.layer && layers[next.layer]) return { layer: next.layer, node: null };
    return { layer: null, node: null };
  }

  function readHash() {
    var h = location.hash || "";
    try {
      if (h.indexOf(HASH_NODE) === 0) return { node: decodeURIComponent(h.slice(HASH_NODE.length)) };
      if (h.indexOf(HASH_LAYER) === 0) return { layer: decodeURIComponent(h.slice(HASH_LAYER.length)) };
    } catch (e) {}
    return {};
  }

  function writeHash() {
    var h = state.node ? HASH_NODE + encodeURIComponent(state.node)
      : state.layer ? HASH_LAYER + encodeURIComponent(state.layer) : "";
    if ((location.hash || "") === h) return;
    try {
      history.replaceState(null, "", h || (location.pathname + location.search));
    } catch (e) {
      try { location.hash = h; } catch (e2) {}
    }
  }

  function go(next, opts) {
    state = normalise(next);
    apply();
    writeHash();
    if (state.node && opts && opts.reveal) reveal(chipEls[state.node]);
  }

  function back() {
    if (state.node) go({ layer: state.layer });
    else if (state.layer) go({});
  }

  function isSheet() {
    return !!(window.matchMedia && window.matchMedia(SHEET_QUERY).matches);
  }

  // Keep the lit chip in view: above the sheet on a phone, inside the viewport on a desktop.
  function reveal(target) {
    if (!target || !target.getBoundingClientRect) return;
    var r = target.getBoundingClientRect();
    var bottom = window.innerHeight - (isSheet() ? panel.offsetHeight : 0);
    if (r.top >= 8 && r.bottom <= bottom - 8) return;
    var delta = r.top - Math.max(8, (bottom - r.height) / 3);
    var smooth = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    try { window.scrollBy({ top: delta, behavior: smooth ? "smooth" : "auto" }); }
    catch (e) { window.scrollBy(0, delta); }
  }

  // ------------------------------------------------------------------ level 2: the zoom
  function apply() {
    var sel = state.node, lid = state.layer;
    var lit = sel ? neighbours(sel) : {};
    if (sel) lit[sel] = true;
    stage.classList.toggle("is-open", !!(sel || lid));
    order.forEach(function (id) {
      var c = chipEls[id];
      if (!c) return;
      c.classList.toggle("is-sel", id === sel);
      c.classList.toggle("is-near", !!sel && id !== sel && !!lit[id]);
      c.classList.toggle("is-dim", !!sel && !lit[id]);
      c.setAttribute("aria-pressed", id === sel ? "true" : "false");
    });
    layerOrder.forEach(function (l) {
      var t = tileEls[l], dim = false;
      if (sel) dim = !membersOf(l).some(function (id) { return lit[id]; });
      else if (lid) dim = l !== lid;
      t.classList.toggle("is-dim", dim);
      t.classList.toggle("is-zoom", !sel && l === lid);
    });
    renderPanel();
  }

  function crumbs() {
    crumbsEl.textContent = "";
    var parts = [el("button", { type: "button", "data-home": "1" }, ["Anatomy"])];
    var l = state.layer ? layers[state.layer] : null;
    if (l) {
      parts.push(state.node
        ? el("button", { type: "button", "data-layer": l.id }, [l.title || l.id])
        : el("span", { "aria-current": "page" }, [l.title || l.id]));
    }
    if (state.node) {
      var n = nodes[state.node];
      parts.push(el("span", { "aria-current": "page" }, [n.label || n.id]));
    }
    parts.forEach(function (p, i) {
      if (i) crumbsEl.appendChild(el("span", { className: "am-sep", "aria-hidden": "true" }, ["›"]));
      crumbsEl.appendChild(p);
    });
  }

  function chipRow(ids) {
    var row = el("div", { className: "am-chips" });
    ids.forEach(function (id) { row.appendChild(chip(id)); });
    return row;
  }

  function group(heading, ids) {
    return el("div", { className: "am-rel" }, [
      el("h3", { className: "am-rel-h" }, [heading, el("span", { className: "am-count" }, [String(ids.length)])]),
      chipRow(ids)
    ]);
  }

  // Level 3: the file itself, one button away.
  function fileBlock(n) {
    if (!n.path) {
      return el("p", { className: "am-note" }, [n.kind === "human"
        ? "A person, not a file: nothing to open."
        : "Lives outside the repository (by design), so there is no file to open."]);
    }
    var kids = [el("code", { className: "am-path" }, [n.path])];
    if (n.url) {
      var onGithub = n.url.indexOf("https://github.com/") === 0;
      kids.push(el("a", { className: "am-open", href: n.url, target: "_blank", rel: "noopener" },
        [onGithub ? "Open on GitHub ↗" : "Open the file ↗"]));
    } else if (n.local) {
      kids.push(el("span", { className: "am-note" },
        ["Machine-local (gitignored): every checkout writes its own copy, so it is not on GitHub."]));
    } else {
      kids.push(el("span", { className: "am-note" }, ["Not written yet in this checkout: no link."]));
    }
    return el("div", { className: "am-file" }, kids);
  }

  function description(text) {
    var p = el("p", { className: "am-desc is-clamped" }, [text]);
    var more = el("button", { type: "button", className: "am-more", hidden: "hidden" }, ["Show all"]);
    more.addEventListener("click", function () {
      var clamped = p.classList.toggle("is-clamped");
      more.textContent = clamped ? "Show all" : "Show less";
    });
    // Measured after layout: the button only appears when the clamp actually hides text.
    window.requestAnimationFrame(function () {
      if (p.scrollHeight > p.clientHeight + 2) more.removeAttribute("hidden");
      else p.classList.remove("is-clamped");
    });
    return [p, more];
  }

  function renderNode(n) {
    var kids = [
      el("div", { className: "am-kind k-" + n.kind }, [n.kind]),
      el("h2", { className: "am-ptitle" }, [n.title || n.label || n.id]),
      el("p", { className: "am-id" }, [n.id]),
      fileBlock(n)
    ];
    if (n.description) kids = kids.concat(description(n.description));
    if (n.box) {
      var note = el("p", { className: "am-note" }, ["In the architecture diagram it sits inside the box ",
        el("code", null, [n.box]), "."]);
      if (DATA.arch_url) {
        note.appendChild(document.createTextNode(" "));
        note.appendChild(el("a", { href: DATA.arch_url, target: "_blank", rel: "noopener" }, ["See the diagram ↗"]));
      }
      kids.push(note);
    }
    var any = false;
    RELATIONS.forEach(function (r) {
      var ids = (r[2] === "out" ? outRel : inRel)[n.id][r[0]];
      if (ids.length) { any = true; kids.push(group(r[1], ids)); }
    });
    if (!any) kids.push(el("p", { className: "am-note" }, ["No recorded relations."]));
    return kids;
  }

  function renderLayer(l) {
    var members = membersOf(l.id);
    var kids = [el("div", { className: "am-kind" }, ["layer"]),
                el("h2", { className: "am-ptitle" }, [l.title || l.id])];
    if (l.blurb) kids.push(el("p", { className: "am-desc" }, [l.blurb]));
    if (!members.length) {
      kids.push(el("p", { className: "am-note" }, ["No components placed here yet."]));
      return kids;
    }
    kids.push(el("p", { className: "am-note" }, ["Click a component to open it."]));
    KIND_ORDER.forEach(function (k) {
      var ids = members.filter(function (id) { return nodes[id].kind === k; });
      if (ids.length) kids.push(group(KIND_NAMES[k], ids));
    });
    return kids;
  }

  function renderPanel() {
    bodyEl.textContent = "";
    if (!state.node && !state.layer) { crumbsEl.textContent = ""; return; }
    crumbs();
    var kids = state.node ? renderNode(nodes[state.node]) : renderLayer(layers[state.layer]);
    kids.forEach(function (k) { if (k) bodyEl.appendChild(k); });
    panel.scrollTop = 0;
  }

  // ------------------------------------------------------------------ wiring
  function renderFoot() {
    var edges = 0;
    order.forEach(function (id) {
      edges += outRel[id].reads.length + outRel[id].writes.length + outRel[id].invokes.length;
    });
    footEl.appendChild(document.createTextNode("Built by "));
    footEl.appendChild(el("code", null, ["mapctl.py anatomy"]));
    footEl.appendChild(document.createTextNode(" from the system map" +
      (DATA.compiled ? " compiled " + DATA.compiled : "") + ": " + order.length + " components, " +
      edges + " relations."));
    if (DATA.arch_url) {
      footEl.appendChild(document.createTextNode(" The same system as one diagram: "));
      footEl.appendChild(el("a", { href: DATA.arch_url, target: "_blank", rel: "noopener" }, ["ARCHITECTURE.md ↗"]));
    }
  }

  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    var hit = t.closest("[data-id]");
    if (hit && nodes[hit.getAttribute("data-id")]) {
      go({ node: hit.getAttribute("data-id") }, { reveal: true });
      return;
    }
    hit = t.closest("[data-layer]");
    if (hit && layers[hit.getAttribute("data-layer")]) {
      go({ layer: hit.getAttribute("data-layer") });
      return;
    }
    if (t.closest("[data-home]") || t.closest("#am-close")) go({});
  });

  document.addEventListener("keydown", function (e) {
    if ((e.key === "Escape" || e.key === "Esc") && (state.node || state.layer)) {
      e.preventDefault();
      back();
    }
  });

  window.addEventListener("hashchange", function () { go(readHash(), { reveal: true }); });

  renderTiles();
  renderFoot();
  document.title = (DATA.project ? DATA.project + " · " : "") + "Anatomy map";
  go(readHash(), { reveal: true });
})();
</script>
</body>
</html>
