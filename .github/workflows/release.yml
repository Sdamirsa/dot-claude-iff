# Release workflow: tests gate, then the two distribution zips become a GitHub Release.
#
# This file lives outside .claude/ because GitHub mandates the .github/ path (the same
# "iff it must" exception as the root .gitignore). The zips themselves are built by
# .claude/tools/distctl.py, the same registered generator the ritual runs, so what a
# release carries is byte-identical to what the repo ships.
#
# Two kinds of tag, one workflow (the flow is .claude/reference/release-flow.md):
#   vX.Y.Z-(alpha|beta|rc).N  cut on dev  -> a GitHub PRE-release; "latest" does not move
#   vX.Y.Z                    cut on main -> a full release; becomes "latest"
# Any other v-tag fails the release job: a malformed pre-release tag must not publish as
# stable and move "latest". _lib.py owns the grammar; this file only asks it.
#
# To cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand:  Actions tab -> release -> Run workflow

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # gh release create needs to write releases

jobs:
  # The gate runs on every OS this system claims to support. It is not symmetry for its own
  # sake: the PreToolUse policy gate shipped FAIL-OPEN on Windows through two releases
  # (backslash paths compared against posix prefixes, plus an unmatched PowerShell lane) and
  # was caught by a human running Windows, never by CI. Lesson L-9's prevention rule is this
  # job. The interpreter differs by runner - `python3` on ubuntu, `python` on windows - so the
  # matrix carries the name rather than adding a setup action that would also move the
  # ubuntu job's proven Python version. ci.yml runs the same matrix on every push and PR.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: python3
          - os: windows-latest
            py: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test (the gate - no release over a red suite)
        # Git Bash, not the runner's default PowerShell: on windows-latest a bare `bash` on
        # PATH is the WSL launcher with no distro, so every hook test failed there. Under
        # `shell: bash` Git's own bash comes first, which is also what Claude Code uses.
        shell: bash
        run: ${{ matrix.py }} .claude/tools/tests/run_tests.py -q

  release:
    needs: test
    runs-on: ubuntu-latest   # any OS would do: the zips are LF-normalised and deterministic
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution zips
        run: |
          python3 .claude/tools/distctl.py build
          ls -la .claude/dist/
          # The rebuild must equal the committed zips (the suite already proved it; this is the
          # same claim made where the assets are published).
          git diff --exit-code --stat -- .claude/dist/

      - name: Create the GitHub Release with both zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          KIND_FLAGS=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # prerelease|stable from the one grammar in _lib; exit 1 on a malformed tag.
            KIND="$(python3 .claude/tools/_lib.py --release-kind "$TAG")" || exit 1
            if [ "$KIND" = "prerelease" ]; then
              KIND_FLAGS="--prerelease --latest=false"
            fi
          else
            TAG="manual-$(date -u +%Y%m%d-%H%M%S)"
            git tag "$TAG" && git push origin "$TAG"
          fi
          # Notes come from the tag's own CHANGELOG.md section - the changelog_parity CHECK
          # step guarantees it exists, so a release can never outrun its changelog. The heading
          # match is exact (_lib.changelog_section): v3.0 never picks up '## v3.0.1'. The
          # boilerplate below it is the same for every release.
          python3 - "$TAG" > /tmp/release-notes.md <<'PY'
          import sys
          sys.path.insert(0, ".claude/tools")
          import _lib
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          section = _lib.changelog_section(text, tag)
          print((section or "See CHANGELOG.md.") + "\n")
          PY
          {
            echo ""
            echo "---"
            echo ""
            echo "**Fresh start**: unzip \`dot-claude-iff-fresh.zip\` into a new or empty repo root and follow its \`START-HERE.md\`."
            echo "**Existing repo**: unzip \`dot-claude-iff-adopt-kit.zip\` anywhere outside your repo and follow its \`ADOPT.md\` - your files are merged, never overwritten."
            echo ""
            echo "Manual: \`.claude/README.md\` in either zip."
          } >> /tmp/release-notes.md
          # KIND_FLAGS is deliberately unquoted: empty for a stable tag, two flags for a
          # pre-release.
          gh release create "$TAG" \
            ".claude/dist/dot-claude-iff-fresh.zip#Fresh start (unzip into a new repo)" \
            ".claude/dist/dot-claude-iff-adopt-kit.zip#Adopt kit (for an existing repo)" \
            --title "dot-claude-iff $TAG" \
            --notes-file /tmp/release-notes.md \
            $KIND_FLAGS
