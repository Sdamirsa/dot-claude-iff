/* ============================================================================================
 * MAP
 * ========================================================================================== */

let mapView = "flows"; // "backbone" | "flows"
let focusedNodeId = null; // FEATURE: focus mode - id of the node currently traced, or null
// The scope switcher: "cards" (map.json, the component cards: the default) or one scope id
// from the architecture spec (DATA.architecture, system-map/architecture.json). Not persisted:
// a reload starts on cards, and a scope missing from a later poll falls back to cards.
let mapScope = "cards";

// Neighbors = nodes sharing any edge with `nodeId`, either direction.
function mapNeighborIds(edges, nodeId) {
  const ids = new Set();
  edges.forEach(function (e) {
    if (e.from === nodeId) ids.add(e.to);
    if (e.to === nodeId) ids.add(e.from);
  });
  return ids;
}

// The spec's usable scopes: entries with a string id only, so a partial or older spec
// degrades to fewer buttons, never a broken tab. "cards" is the built-in view's own id, so a
// spec scope by that name is skipped rather than shadowing it. Empty means no switcher.
function mapScopes() {
  const arch = DATA.architecture;
  if (!arch || !Array.isArray(arch.scopes)) return [];
  return arch.scopes.filter(function (s) {
    return s && typeof s === "object" && typeof s.id === "string" && s.id !== "" && s.id !== "cards";
  });
}

function renderScopeSwitcher(scopes) {
  const bar = el("div", { class: "map-toolbar map-scope-switch", role: "group", "aria-label": "map scope" });
  [{ id: "cards", title: "cards", root: null }].concat(scopes).forEach(function (s) {
    const btn = el("button", {
      type: "button", class: "view-btn" + (mapScope === s.id ? " active" : ""),
      dataset: { scope: s.id },
      title: s.root ? ("scope root: " + s.root) : "the component cards (map.json)"
    }, [s.title || s.id]);
    // Like a view change, a scope change rebuilds the canvas, so a stale focus is dropped.
    btn.addEventListener("click", function () { mapScope = s.id; focusedNodeId = null; renderMap(); });
    bar.appendChild(btn);
  });
  return bar;
}

// The cards view: map.json's layers as bands (spines, then flows, UNPLACED last), its edges
// as typed lines, and openNodeDialog for the detail popup.
function cardsMapView(map) {
  const layers = (map.layers) || { spines: [], flows: [], unplaced: null };
  const orderedLayers = []
    .concat((layers.spines || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }))
    .concat((layers.flows || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }));
  if (layers.unplaced) orderedLayers.push(layers.unplaced);

  const nodesByLayer = {};
  (map.nodes || []).forEach(function (n) {
    const key = orderedLayers.some(function (l) { return l.id === n.layer; }) ? n.layer : (layers.unplaced ? layers.unplaced.id : "UNPLACED");
    (nodesByLayer[key] = nodesByLayer[key] || []).push(n);
  });

  return {
    // The color language, stated where the nodes are: what each hue MEANS. Kind is the
    // component's role, and the legend is what lets a first-time reader decode the map
    // without leaving the tab.
    kinds: [["agent", "agent - a sub-agent definition"],
            ["code", "code - a tool, hook or skill that runs"],
            ["data", "data - a store, config or contract"],
            ["human", "human - a person in the loop"],
            ["external", "external - outside this repo"]],
    edgeKeys: [["edge-key-invoke", "invokes - calls or dispatches"],
               ["edge-key-write", "writes - produces or mutates"],
               ["edge-key-read", "reads - consumes"]],
    bands: orderedLayers.map(function (layer) {
      return {
        title: layer.title || layer.id, blurb: layer.blurb || "",
        unplaced: !!(layers.unplaced && layer.id === layers.unplaced.id),
        nodes: nodesByLayer[layer.id] || []
      };
    }),
    edges: map.edges || [],
    open: openNodeDialog,
    meta: null
  };
}

const SPEC_KIND_LEGEND = [
  ["code", "code - a tool, hook or script"],
  ["agent", "agent - a sub-agent definition"],
  ["data", "data - a store, config or contract"],
  ["human", "human - a person in the loop"],
  ["folder", "folder - several files folded into one box"],
  ["file", "file - one source file"]
];
const SPEC_EDGE_KEY = { invokes: "edge-key-invoke", writes: "edge-key-write", reads: "edge-key-read" };

function ownKey(obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); }

// A spec scope as bands: the spec's groups in order, each node in its group's band, and any
// node naming an unknown group in a trailing "ungrouped" band (shown, never dropped). Edges
// keep their label (drawn at the midpoint) and their solid/dashed style; weight shows as xN.
// Ids are card ids (tool.statectl): they only ever travel as data-* values and object keys.
function specMapView(scope) {
  const groups = (Array.isArray(scope.groups) ? scope.groups : []).filter(function (g) {
    return g && typeof g.id === "string";
  });
  const byGroup = Object.create(null);
  groups.forEach(function (g) { byGroup[g.id] = []; });
  const ungrouped = [];
  const kindsSeen = Object.create(null);
  (Array.isArray(scope.nodes) ? scope.nodes : []).forEach(function (n) {
    if (!n || typeof n.id !== "string") return;
    const node = {
      id: n.id, title: n.label || n.id, kind: n.kind, path: n.path, group: n.group,
      glyphs: n.kind === "folder" ? ["folder"] : []
    };
    kindsSeen[n.kind] = true;
    (typeof n.group === "string" && byGroup[n.group] ? byGroup[n.group] : ungrouped).push(node);
  });

  const edges = [];
  const edgeKeys = [];
  const keysSeen = Object.create(null);
  (Array.isArray(scope.edges) ? scope.edges : []).forEach(function (e) {
    if (!e || typeof e.from !== "string" || typeof e.to !== "string") return;
    const label = typeof e.label === "string" ? e.label : "";
    const weight = typeof e.weight === "number" && e.weight > 1 ? e.weight : 0;
    const styleCls = e.style === "dashed" ? " edge-dashed" : (e.style === "solid" ? " edge-solid" : "");
    edges.push({
      from: e.from, to: e.to, type: label, style: e.style, weight: weight,
      cls: (ownKey(EDGE_STYLE_BY_TYPE, label) ? EDGE_STYLE_BY_TYPE[label] : "edge-control") + styleCls,
      edgeText: label + (weight ? " ×" + weight : "")
    });
    const legendKey = label + "|" + (e.style || "");
    if (!keysSeen[legendKey]) {
      keysSeen[legendKey] = true;
      edgeKeys.push([(ownKey(SPEC_EDGE_KEY, label) ? SPEC_EDGE_KEY[label] : "edge-key-other")
        + (e.style === "dashed" ? " is-dashed" : (e.style === "solid" ? " is-solid" : "")), label || "unlabelled"]);
    }
  });

  const bands = groups.map(function (g) {
    return { title: g.title || g.id, blurb: g.blurb || "", unplaced: false, nodes: byGroup[g.id] };
  });
  if (ungrouped.length) bands.push({ title: "ungrouped", blurb: "a node whose group the spec does not define", unplaced: true, nodes: ungrouped });

  const stats = (scope.stats && typeof scope.stats === "object") ? scope.stats : {};
  const nodeCount = bands.reduce(function (sum, b) { return sum + b.nodes.length; }, 0);
  const meta = (scope.root ? "root " + scope.root + " · " : "")
    + nodeCount + " box" + (nodeCount === 1 ? "" : "es") + " · " + edges.length + " arrow" + (edges.length === 1 ? "" : "s")
    + (typeof stats.folded === "number" && stats.folded > 0 ? " · " + stats.folded + " folded" : "")
    + (DATA.architecture && DATA.architecture.generated_at ? " · spec " + DATA.architecture.generated_at : "");

  return {
    kinds: SPEC_KIND_LEGEND.filter(function (pair) { return kindsSeen[pair[0]]; }),
    edgeKeys: edgeKeys,
    bands: bands,
    edges: edges,
    open: function (node) { openSpecNodeDialog(node, scope, edges); },
    meta: meta
  };
}

function renderMap() {
  const panel = document.getElementById("panel-map");
  clear(panel);
  const head = el("div", { class: "card" }, [sectionHead("System map", "map")]);
  panel.appendChild(head);

  // The switcher appears only when the spec has scopes; otherwise the tab is the cards view,
  // exactly as before the spec existed.
  const scopes = mapScopes();
  const scope = scopes.filter(function (s) { return s.id === mapScope; })[0] || null;
  if (!scope) mapScope = "cards";
  if (scopes.length) panel.appendChild(renderScopeSwitcher(scopes));

  let view;
  if (scope) {
    view = specMapView(scope);
  } else {
    const map = DATA.map;
    if (!map) {
      panel.appendChild(el("div", { class: "card" }, [
        el("div", { class: "empty-state" }, ["Map not built yet - run /project-memory to compile the system map."])
      ]));
      return;
    }
    view = cardsMapView(map);
  }

  const legend = el("div", { class: "map-legend" });
  view.kinds.forEach(function (pair) {
    legend.appendChild(el("span", { class: "legend-item" }, [
      el("span", { class: "legend-swatch kind-" + pair[0] }),
      pair[1],
    ]));
  });
  panel.appendChild(legend);

  const edgeLegend = el("div", { class: "map-legend" });
  view.edgeKeys.forEach(function (pair) {
    edgeLegend.appendChild(el("span", { class: "legend-item" }, [
      el("span", { class: "legend-line " + pair[0] }),
      pair[1],
    ]));
  });
  panel.appendChild(edgeLegend);

  const toolbar = el("div", { class: "map-toolbar" });
  ["backbone", "flows"].forEach(function (v) {
    const btn = el("button", { type: "button", class: "view-btn" + (mapView === v ? " active" : "") }, [v]);
    // Changing views rebuilds the node grid from scratch, so a stale focus (pointing at DOM
    // that is about to be discarded) is cleared rather than carried forward - explicitly fine
    // per spec, and simpler than trying to re-target it onto the new layout.
    btn.addEventListener("click", function () { mapView = v; focusedNodeId = null; renderMap(); });
    toolbar.appendChild(btn);
  });
  panel.appendChild(toolbar);
  if (view.meta) panel.appendChild(el("div", { class: "map-scope-meta" }, [view.meta]));

  const canvas = el("div", { class: "map-canvas", dataset: { view: mapView } });
  const svg = svgEl("svg", { class: "map-edges" });
  canvas.appendChild(svg);

  const edges = view.edges;
  const nodeEls = Object.create(null);

  // FEATURE: focus mode. First click on a node fades every non-neighbor node/edge and raises
  // the focused node + its neighbors + their connecting edges above that faded layer; a second
  // click on the SAME node opens the detail popup instead. Implemented as class toggles over
  // the already-built DOM (never a re-render), so the measured-edge redraw below and
  // assertNoOverlap keep running exactly as before - focus only changes what they draw on top of.
  function applyFocusClasses() {
    const neighborIds = focusedNodeId ? mapNeighborIds(edges, focusedNodeId) : null;
    Object.keys(nodeEls).forEach(function (id) {
      const nodeEl = nodeEls[id];
      const isFocus = focusedNodeId !== null && id === focusedNodeId;
      const isNeighbor = !!(neighborIds && neighborIds.has(id));
      nodeEl.classList.toggle("is-focus-node", isFocus);
      nodeEl.classList.toggle("is-neighbor-node", isNeighbor);
      nodeEl.classList.toggle("is-faded-node", focusedNodeId !== null && !isFocus && !isNeighbor);
    });
  }
  function setMapFocus(nodeId) {
    focusedNodeId = nodeId;
    applyFocusClasses();
    redraw();
  }
  function clearMapFocus() {
    if (focusedNodeId === null) return;
    focusedNodeId = null;
    applyFocusClasses();
    redraw();
  }

  view.bands.forEach(function (bandSpec) {
    const nodes = bandSpec.nodes;
    const band = el("div", { class: "map-layer" + (bandSpec.unplaced ? " is-unplaced" : "") });
    band.appendChild(el("div", { class: "map-layer-head" }, [
      el("h3", {}, [bandSpec.title]),
      el("span", { class: "blurb" }, [bandSpec.blurb + " · " + nodes.length + " node" + (nodes.length === 1 ? "" : "s")])
    ]));
    const nodesWrap = el("div", { class: "map-nodes" });
    nodes.forEach(function (n) {
      const swatch = el("span", { class: "swatch", style: "background:" + kindColor(n.kind) + ";" });
      const nodeEl = el("div", { class: "map-node", dataset: { nodeId: n.id }, tabindex: "0" }, [
        swatch,
        el("span", { class: "title" }, [n.title || n.id])
      ]);
      (n.glyphs || []).slice(0, 2).forEach(function (g) { nodeEl.appendChild(el("span", { class: "glyph" }, [g])); });
      // First click focuses; a second click on the node that is ALREADY focused opens the
      // detail popup; clicking a different node while focused just moves focus to it.
      const activate = function () {
        if (focusedNodeId === n.id) { view.open(n); return; }
        setMapFocus(n.id);
      };
      nodeEl.addEventListener("click", function (ev) { ev.stopPropagation(); activate(); });
      nodeEl.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activate(); } });
      nodeEls[n.id] = nodeEl;
      nodesWrap.appendChild(nodeEl);
    });
    band.appendChild(nodesWrap);
    canvas.appendChild(band);
  });

  // A click that lands on the canvas itself (not a node - those stopPropagation) clears focus.
  canvas.addEventListener("click", function () { clearMapFocus(); });

  panel.appendChild(canvas);
  panel.appendChild(el("div", { class: "map-hint" }, [
    "click a component to trace its connections · click again for details · Esc to clear"
  ]));
  panel.appendChild(renderContextCard());

  function redraw() {
    drawEdges(canvas, svg, edges, nodeEls);
    requestAnimationFrame(function () { assertNoOverlap(canvas); });
  }
  applyFocusClasses(); // reapplies a focus carried over from before this (poll-driven) re-render
  redraw();
  // renderMap runs on EVERY poll (5s while active), so registering a listener here without
  // removing the previous one leaked ~720 listeners an hour, each retaining a detached map
  // subtree and each running an O(n^2) overlap check on any resize. Keep exactly one.
  if (panel._mapResizeHandler) window.removeEventListener("resize", panel._mapResizeHandler);
  panel._mapResizeHandler = redraw;
  window.addEventListener("resize", redraw);
  // fonts.ready resolves once per page; attach the callback only the first time through.
  if (!panel._mapFontsHooked && document.fonts && document.fonts.ready) {
    panel._mapFontsHooked = true;
    document.fonts.ready.then(function () {
      if (panel._mapRedraw) panel._mapRedraw();
    });
  }
  panel._mapRedraw = redraw;
  // Escape clears focus. Registered once (like the fonts.ready hook above) and dispatched
  // through panel._mapClearFocus, which is repointed at the latest closure on every render -
  // the same indirection the resize handler already uses to survive renderMap re-running.
  panel._mapClearFocus = clearMapFocus;
  if (!panel._mapEscHooked) {
    panel._mapEscHooked = true;
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && panel._mapClearFocus) panel._mapClearFocus();
    });
  }
}

// Context: the guides (CLAUDE.md files) and rules (.claude/rules/) Claude Code loads, derived
// by ctxmap.py into map.json at compile and carried as DATA.context. A list, not map nodes:
// guides and rules never need a card, so they are listed beside the canvas, not drawn on it.
// Every field is optional on read so an older payload (or none) still renders.
function renderContextCard() {
  const ctx = DATA.context || { entries: [] };

  const card = el("div", { class: "card" }, [sectionHead("Context", "map")]);
  if (!entries.length) {

  }

    "always-on " + (ctx.always_on_lines || 0) + (ctx.always_on_budget ? " of " + ctx.always_on_budget : "")
    + " lines · " + (f.fail || 0) + " fail · " + (f.warn || 0) + " warn"
  ]));
  entries.forEach(function (e) {
    card.appendChild(el("div", { class: "ctx-row" }, [
      pathLink(e.path, e.path, "ctx-path mono"),
      el("span", { class: "ctx-kind" }, [(e.kind || "") + (e.loads ? " · " + e.loads : "")]),
      el("span", { class: "ctx-scope", title: e.via ? ("imported by " + e.via) : null }, [e.scope || ""]),

    ]));

  card.appendChild(copyBox("python3 .claude/tools/mapctl.py context <path>", "what loads for one file, in order (copy and run it yourself)"));
  return card;
}

// Six edge styles by name, as specified. mapctl.py's build_map() currently derives edges
// straight from a card's reads/writes/invokes relation FIELDS, so the type values it emits
// today are the plural "reads"/"writes"/"invokes" (card-schema vocabulary), not this set -
// both are mapped here so real map.json data renders correctly now, and a future producer
// (or a hand-authored card) using "control"/"feedback"/"human"/"validates" directly also
// renders correctly rather than silently falling through to one default style.
const EDGE_STYLE_BY_TYPE = {
  control: "edge-control", feedback: "edge-feedback",
  write: "edge-write", writes: "edge-write",
  read: "edge-read", reads: "edge-read",
  human: "edge-human",
  validates: "edge-validates",
  invoke: "edge-invoke", invokes: "edge-invoke",
};

function drawEdges(container, svg, edges, nodeEls) {
  clear(svg);
  if (mapView !== "flows") return;
  const cRect = container.getBoundingClientRect();
  const focusActive = focusedNodeId !== null;
  // Faded edges are appended first, focused/normal ones after - SVG paints in document order,
  // so this keeps a highlighted edge from ever being buried under a faded one it crosses.
  const behind = [];
  const onTop = [];
  const labels = [];
  edges.forEach(function (e) {
    const a = nodeEls[e.from];
    const b = nodeEls[e.to];
    if (!a || !b) return;
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();
    const x1 = ar.left + ar.width / 2 - cRect.left;
    const y1 = ar.top + ar.height / 2 - cRect.top;
    const x2 = br.left + br.width / 2 - cRect.left;
    const y2 = br.top + br.height / 2 - cRect.top;
    const touchesFocus = focusActive && (e.from === focusedNodeId || e.to === focusedNodeId);
    // A spec edge (specMapView) brings its own class, label style included; a card edge's
    // class comes from its type.
    let cls = e.cls || EDGE_STYLE_BY_TYPE[e.type] || "edge-control";
    if (focusActive) cls += touchesFocus ? " is-focus-edge" : " is-faded-edge";
    const line = svgEl("line", { x1: x1, y1: y1, x2: x2, y2: y2, class: cls });
    (focusActive && !touchesFocus ? behind : onTop).push(line);
    // A spec edge's label sits at its midpoint; while a node is focused only the edges that
    // touch it keep their label, so a traced path reads without the rest in the way.
    if (e.edgeText && (!focusActive || touchesFocus)) {
      const text = svgEl("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2, class: "edge-label",
                                   "text-anchor": "middle", "dominant-baseline": "middle" });
      text.textContent = e.edgeText;
      labels.push(text);
    }
  });
  behind.forEach(function (line) { svg.appendChild(line); });
  onTop.forEach(function (line) { svg.appendChild(line); });
  labels.forEach(function (text) { svg.appendChild(text); });
}

function assertNoOverlap(container) {
  const boxes = Array.prototype.slice.call(container.querySelectorAll(".map-node")).map(function (n) {
    return { id: n.dataset.nodeId, rect: n.getBoundingClientRect() };
  });
  for (let i = 0; i < boxes.length; i++) {
    for (let j = i + 1; j < boxes.length; j++) {
      const a = boxes[i].rect, b = boxes[j].rect;
      const overlap = !(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top);
      if (overlap) console.warn("[console/map] node boxes overlap:", boxes[i].id, boxes[j].id);
    }
  }
}

function openNodeDialog(node) {
  const dialog = document.getElementById("node-dialog");
  document.getElementById("node-dialog-title").textContent = node.title || node.id;
  const body = document.getElementById("node-dialog-body");
  clear(body);
  body.appendChild(kindChip(node.kind));
  if (node.exists === false) {
    body.appendChild(el("div", { class: "dialog-section", style: "color:var(--sev0-bg);font-weight:600;" }, ["path does not exist on disk"]));
  }
  if (node.description) body.appendChild(el("div", { class: "dialog-section" }, [el("div", { class: "label" }, ["description"]), el("div", {}, [node.description])]));
  if (node.path) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["source"]),
      pathLink(node.path, node.path, "mono")
    ]));
  }
  // Relations live on EDGES (mapctl.py's map.json carries no per-node reads/writes/invokes
  // arrays - those become edges keyed by from/to), so they are read from DATA.map.edges
  // rather than from the node object itself. "flows" IS a real per-node field (which flow
  // layers this component participates in) and stays a direct node read.
  const edges = (DATA.map && DATA.map.edges) || [];
  const outgoing = edges.filter(function (e) { return e.from === node.id; });
  const incoming = edges.filter(function (e) { return e.to === node.id; });
  if (outgoing.length) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["relations (out)"]),
      el("div", {}, outgoing.map(function (e) { return el("span", { class: "rel-tag" }, [e.type + " → " + e.to]); }))
    ]));
  }
  if (incoming.length) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["relations (in)"]),
      el("div", {}, incoming.map(function (e) { return el("span", { class: "rel-tag" }, [e.from + " → " + e.type]); }))
    ]));
  }
  if (node.flows && node.flows.length) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["flows"]),
      el("div", {}, node.flows.map(function (v) { return el("span", { class: "rel-tag" }, [v]); }))
    ]));
  }
  dialog.showModal();
}

// A spec node's detail: its group and the group's blurb, the card id, the path (pathLink: a
// real link only under file:) with the editor link beside it when live, and every edge in and
// out with its label. The edges are the drawn scope's, never map.json's.
function openSpecNodeDialog(node, scope, edges) {
  const dialog = document.getElementById("node-dialog");
  document.getElementById("node-dialog-title").textContent = node.title || node.id;
  const body = document.getElementById("node-dialog-body");
  clear(body);
  body.appendChild(kindChip(node.kind));
  const group = (Array.isArray(scope.groups) ? scope.groups : []).filter(function (g) { return g && g.id === node.group; })[0];
  body.appendChild(el("div", { class: "dialog-section" }, [
    el("div", { class: "label" }, ["group"]),
    el("div", {}, [group ? (group.title || group.id) : "ungrouped"]),
    group && group.blurb ? el("div", { style: "color:var(--text-dim);font-size:12px;" }, [group.blurb]) : null
  ]));
  body.appendChild(el("div", { class: "dialog-section" }, [
    el("div", { class: "label" }, ["id"]),
    el("span", { class: "mono" }, [node.id])
  ]));
  if (node.path) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["source"]),
      pathLink(node.path, node.path, "mono"),
      editorLink(node.path)
    ]));
  }
  const outgoing = edges.filter(function (e) { return e.from === node.id; });
  const incoming = edges.filter(function (e) { return e.to === node.id; });
  if (outgoing.length) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["arrows (out)"]),
      el("div", {}, outgoing.map(function (e) { return el("span", { class: "rel-tag" }, [(e.edgeText || "→") + " → " + e.to]); }))
    ]));
  }
  if (incoming.length) {
    body.appendChild(el("div", { class: "dialog-section" }, [
      el("div", { class: "label" }, ["arrows (in)"]),
      el("div", {}, incoming.map(function (e) { return el("span", { class: "rel-tag" }, [e.from + " → " + (e.edgeText || "→")]); }))
    ]));
  }
  dialog.showModal();
}

document.getElementById("node-dialog-close").addEventListener("click", function () {
  document.getElementById("node-dialog").close();
});

/* ============================================================================================
 * STORY
 * Reads EXACTLY the STORY_CONTRACT key paths (mirrors obsctl.py's producer contract) -
 * v, clock.wall_min/wall_max/tokens_max, points[].date, points[].t_tokens_cum,
 * points[].operations.{events,errors,sessions,tokens_out,cost_usd},
 * points[].anatomy.{agents,skills,hooks,tools,cards,components}, points[].data,
 * points[].analysis, markers[].{date,t_tokens_cum,kind,text,ref}. No other keys are read.
 * ========================================================================================== */

let storyClock = "wall"; // "wall" | "tokens"

// Deterministic, subtle color for an analysis label chip: reuses the app's existing kind-color
// tokens (already tuned to be legible and quiet) rather than inventing a new palette, picked by
// a stable hash of the label name so the same label always gets the same color across renders.
const ANALYSIS_LABEL_COLORS = [
  { bg: "--color-agent", fg: "#ffffff" },
  { bg: "--color-code", fg: "#ffffff" },
  { bg: "--color-data", fg: "#ffffff" },
  { bg: "--color-human", fg: "#1b1f24" },
  { bg: "--color-external", fg: "#ffffff" }
];

function analysisLabelStyle(label) {
  let h = 0;
  for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
  const t = ANALYSIS_LABEL_COLORS[h % ANALYSIS_LABEL_COLORS.length];
  return "background:" + "var(" + t.bg + ");color:" + t.fg + ";";
}

// Strip a "scheme://" prefix for display - the status chip shows where the endpoint IS, not a
// clickable/fetchable URL.
function urlHost(u) {
  if (!u) return "-";
  const m = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\/([^/]+)/.exec(u);
  return m ? m[1] : u;
}

// -- Retrospective analysis card: three states driven entirely by DATA.analysis -------------
// null/undefined -> hidden; configured:false -> setup guide; configured:true -> status + control.

function renderSetupGuide(analysis) {
  const wrap = el("div", {});
  // The what/how lives in the card's info box above; this guide is only the actionable steps.
  wrap.appendChild(el("div", { class: "kv-row" }, [
    "Taxonomy: " + ((analysis.taxonomy || []).join(", ") || "none configured yet")
    + ". Nothing is sent anywhere until you configure an endpoint and run it yourself."
  ]));
  wrap.appendChild(el("ul", {}, [
    el("li", { class: "kv-row" }, ["OpenRouter - get a key at openrouter.ai/keys"]),
    el("li", { class: "kv-row" }, ["OpenAI - get a key at platform.openai.com/api-keys"]),
    el("li", { class: "kv-row" }, ["Local Ollama at localhost:11434/v1 - no key needed"])
  ]));
  wrap.appendChild(el("div", { class: "kv-row" }, [
    "Put base_url and model in .claude/config/observe.json under \"analyze\". The key itself "
    + "goes in the env block of .claude/settings.local.json (per-user, gitignored), never in "
    + "that file:"
  ]));
  wrap.appendChild(copyBox("\"env\": { \"ANALYZE_API_KEY\": \"sk-...\" }",
    "outside Claude Code: export ANALYZE_API_KEY=sk-... in your shell · also accepted: "
    + (analysis.key_envs_accepted || []).join(", ") + " · see .claude/reference/secrets.md"));

  const statusRow = el("div", { class: "sev-row" });
  if (analysis.key_env) {
    statusRow.appendChild(el("span", { class: "badge badge-live" }, ["key found in " + analysis.key_env]));
  } else if (analysis.key_required) {
    statusRow.appendChild(el("span", { class: "badge" }, ["no key found in environment"]));
  }
  wrap.appendChild(statusRow);
  return wrap;
}

function runAnalysis(btn, statusEl) {
  const originalLabel = btn.textContent;
  btn.setAttribute("disabled", "disabled");
  btn.textContent = "Starting...";
  clear(statusEl);
  fetch("/live/analyze", { method: "POST", cache: "no-store" }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      return { status: res.status, body: body };
    });
  }).then(function (r) {
    if (r.status === 202) {
      btn.textContent = "Started";
      statusEl.textContent = "Analysis started - this refreshes automatically as it runs.";
    } else if (r.status === 409) {
      btn.textContent = originalLabel;
      btn.removeAttribute("disabled");
      statusEl.textContent = (r.body && r.body.reason) || "could not start the run.";
    } else {
      btn.textContent = originalLabel;
      btn.removeAttribute("disabled");
      statusEl.textContent = "request failed (status " + r.status + ").";
    }
  }).catch(function () {
    btn.textContent = originalLabel;
    btn.removeAttribute("disabled");
    statusEl.textContent = "request failed - is the live server still running?";
  });
}

function renderConfiguredStatus(analysis) {
  const wrap = el("div", {});
  const state = (analysis.run && analysis.run.state) || "idle";
  const running = state === "running";
  const statusRow = el("div", { class: "sev-row" }, [
    el("span", { class: "badge" }, ["endpoint " + urlHost(analysis.base_url)]),
    el("span", { class: "badge" }, ["model " + (analysis.model || "-")]),
    el("span", { class: "badge" }, [fmtNum(analysis.products) + " product" + (analysis.products === 1 ? "" : "s")]),
    el("span", { class: "badge" + (running ? " badge-live" : "") }, [
      state + ((analysis.run && analysis.run.detail) ? " - " + analysis.run.detail : "")
    ])
  ]);
  wrap.appendChild(statusRow);

  const statusMsg = el("div", { class: "copy-note" }, []);
  if (isLiveCapable()) {
    const btn = el("button", { type: "button", class: "copy-btn" }, [running ? "Running..." : "Run analysis"]);
    if (running) btn.setAttribute("disabled", "disabled");
    btn.addEventListener("click", function () { runAnalysis(btn, statusMsg); });
    wrap.appendChild(el("div", { class: "kv-row" }, [btn]));
    wrap.appendChild(statusMsg);
  } else {
    wrap.appendChild(copyBox(analysis.command, "the live server (console.py) turns this into a Run analysis button"));
  }
  return wrap;
}

function renderAnalysisCard() {
  const analysis = DATA.analysis;
  if (!analysis) return null;
  const card = el("div", { class: "card" }, [sectionHead("Retrospective analysis", "analysis")]);
  const info = el("div", { class: "analysis-info" });
  info.appendChild(el("div", { class: "ai-title" }, ["What this is"]));
  info.appendChild(el("p", {}, [
    "An optional engine that reads the raw record (every captured event, kept in the " +
    "sibling folder outside this repo) and labels it with a model YOU configure: " +
    "errors, decisions, system evolution, data evolution."]));
  info.appendChild(el("div", { class: "ai-title" }, ["How it works"]));
  info.appendChild(el("p", {}, [
    "Raw events are sent in parallel chunks to an OpenAI-compatible endpoint with a strict " +
    "JSON schema; every reply is validated mechanically (an off-taxonomy label fails its " +
    "whole chunk - nothing is judged by Claude). Plain code then aggregates the labels " +
    "per day into the Analysis-labels lane above. The API key lives only in your " +
    "environment (the env block of .claude/settings.local.json, or your shell); with a " +
    "local Ollama endpoint nothing leaves this machine, and products " +
    "stay in the record until a human promotes them into the repo."]));
  card.appendChild(info);
  card.appendChild(analysis.configured ? renderConfiguredStatus(analysis) : renderSetupGuide(analysis));
  return card;
}

function storyAnalysisLane(story) {
  const lane = el("div", { class: "story-lane card" });
  lane.appendChild(el("h3", {}, ["Analysis labels"]));
  const points = story.points || [];
  let latest = null;
  for (let i = points.length - 1; i >= 0; i--) {
    if (points[i].analysis && Object.keys(points[i].analysis).length) { latest = points[i]; break; }
  }
  if (!latest) {
    lane.appendChild(el("div", { class: "empty-state" }, ["no analysis labels yet - run an analysis to populate this lane"]));
    return lane;
  }
  lane.appendChild(el("div", { style: "font-size:11px;color:var(--text-dim);margin-bottom:6px;" }, ["as of " + (latest.date || "?")]));
  const row = el("div", { class: "sev-row" });
  const taxonomy = (DATA.analysis && DATA.analysis.taxonomy) || [];
  const seen = {};
  taxonomy.concat(Object.keys(latest.analysis)).forEach(function (label) {
    if (seen[label] || !latest.analysis[label]) return;
    seen[label] = true;
    row.appendChild(el("span", { class: "chip", style: analysisLabelStyle(label) }, [label + " " + fmtNum(latest.analysis[label])]));
  });
  lane.appendChild(row);
  return lane;
}

function renderStory() {
  const panel = document.getElementById("panel-story");
  clear(panel);

  panel.appendChild(el("div", { class: "card" }, [sectionHead("Story", "story")]));

  const story = DATA.story;
  if (!story || !story.points || !story.points.length) {
    panel.appendChild(el("div", { class: "card" }, [
      el("div", { class: "empty-state" }, ["Story not built yet - it is generated by /project-memory's POLISH step."])
    ]));
    return;
  }

  const toggle = el("div", { class: "clock-toggle" });
  [["wall", "Wall date"], ["tokens", "Cumulative output tokens"]].forEach(function (pair) {
    const btn = el("button", { type: "button", class: "clock-btn" + (storyClock === pair[0] ? " active" : "") }, [pair[1]]);
    btn.addEventListener("click", function () { storyClock = pair[0]; renderStory(); });
    toggle.appendChild(btn);
  });
  const clockCard = el("div", { class: "card" }, [toggle]);
  panel.appendChild(clockCard);

  const xScale = buildXScale(story);

  panel.appendChild(storyLane("Operations & errors", [
    ["events", function (p) { return p.operations && p.operations.events; }],
    ["errors", function (p) { return p.operations && p.operations.errors; }],
    ["sessions", function (p) { return p.operations && p.operations.sessions; }],
    ["tokens out", function (p) { return p.operations && p.operations.tokens_out; }],
    ["cost usd", function (p) { return p.operations && p.operations.cost_usd; }]
  ], story, xScale));

  panel.appendChild(storyLane("Anatomy evolution", [
    ["agents", function (p) { return p.anatomy && p.anatomy.agents; }],
    ["skills", function (p) { return p.anatomy && p.anatomy.skills; }],
    ["hooks", function (p) { return p.anatomy && p.anatomy.hooks; }],
    ["tools", function (p) { return p.anatomy && p.anatomy.tools; }],
    ["cards", function (p) { return p.anatomy && p.anatomy.cards; }],
    ["components", function (p) { return p.anatomy && p.anatomy.components; }]
  ], story, xScale));

  panel.appendChild(storyDataLane(story, xScale));
  panel.appendChild(storyAnalysisLane(story));

  const analysisCard = renderAnalysisCard();
  if (analysisCard) panel.appendChild(analysisCard);
}

function buildXScale(story) {
  const clock = story.clock || {};
  if (storyClock === "tokens") {
    const max = clock.tokens_max || Math.max.apply(null, story.points.map(function (p) { return p.t_tokens_cum || 0; }).concat([1]));
    return { key: "tokens", max: max, of: function (p) { return (p.t_tokens_cum || 0) / (max || 1); } };
  }
  const minT = parseTs(clock.wall_min) || Math.min.apply(null, story.points.map(function (p) { return parseTs(p.date) || Infinity; }));
  const maxT = parseTs(clock.wall_max) || Math.max.apply(null, story.points.map(function (p) { return parseTs(p.date) || -Infinity; }));
  const span = Math.max(1, maxT - minT);
  return { key: "wall", min: minT, max: maxT, of: function (p) { return ((parseTs(p.date) || minT) - minT) / span; } };
}

function storyLane(title, metrics, story, xScale) {
  const lane = el("div", { class: "story-lane card" });
  lane.appendChild(el("h3", {}, [title]));
  const grid = el("div", { class: "sparkline-grid" });
  metrics.forEach(function (pair) {
    grid.appendChild(sparklineCard(pair[0], story.points.map(pair[1]), story, xScale));
  });
  lane.appendChild(grid);
  return lane;
}

function storyDataLane(story, xScale) {
  const lane = el("div", { class: "story-lane card" });
  lane.appendChild(el("h3", {}, ["Data evolution"]));
  const sample = story.points.find(function (p) { return p.data !== undefined && p.data !== null; });
  const grid = el("div", { class: "sparkline-grid" });
  if (sample && typeof sample.data === "object") {
    Object.keys(sample.data).forEach(function (key) {
      grid.appendChild(sparklineCard(key, story.points.map(function (p) { return p.data && p.data[key]; }), story, xScale));
    });
  } else if (sample) {
    grid.appendChild(sparklineCard("data", story.points.map(function (p) { return p.data; }), story, xScale));
  } else {
    grid.appendChild(el("div", { class: "empty-state" }, ["no data-series points"]));
  }
  lane.appendChild(grid);
  return lane;
}

function sparklineCard(label, values, story, xScale) {
  const nums = values.map(function (v) { return typeof v === "number" ? v : null; });
  const present = nums.filter(function (v) { return v !== null; });
  const maxV = present.length ? Math.max.apply(null, present.concat([0])) : 1;
  const minV = present.length ? Math.min.apply(null, present.concat([0])) : 0;
  const span = Math.max(1e-9, maxV - minV);
  const W = 100, H = 32;

  const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none" });
  const pts = [];
  story.points.forEach(function (p, i) {
    if (nums[i] === null) return;
    const x = xScale.of(p) * W;
    const y = H - ((nums[i] - minV) / span) * H;
    pts.push(x.toFixed(2) + "," + y.toFixed(2));
  });
  if (pts.length) {
    const areaPts = "0," + H + " " + pts.join(" ") + " " + W + "," + H;
    svg.appendChild(svgEl("polyline", { points: areaPts, class: "sp-area" }));
    svg.appendChild(svgEl("polyline", { points: pts.join(" "), class: "sp-line" }));
  }
  (story.markers || []).forEach(function (m) {
    const x = (xScale.of({ date: m.date, t_tokens_cum: m.t_tokens_cum }) * W).toFixed(2);
    const line = svgEl("line", { x1: x, x2: x, y1: 0, y2: H, class: "sp-marker" });
    const title = svgEl("title", {});
    // m.ref carries where the marker came from (the journal id or artifact behind it). Show it:
    // a field the producer emits and the renderer silently ignores is how a contract rots, and
    // on hover it turns "something happened here" into "this is the thing that happened".
    title.textContent = (m.kind || "marker") + ": " + (m.text || "")
      + (m.ref ? "  [" + m.ref + "]" : "");
    line.appendChild(title);
    svg.appendChild(line);
  });

  const last = present.length ? present[present.length - 1] : null;
  const labelRow = el("div", { class: "sp-label" }, [label, last === null ? "-" : fmtNum(last)]);
  return el("div", { class: "sparkline-card" }, [labelRow, svg]);
}

/* ============================================================================================
 * WORK
 * ========================================================================================== */

function renderWork() {
  const panel = document.getElementById("panel-work");
  clear(panel);
  const work = DATA.work || {};

  const tasksCard = el("div", { class: "card" }, [sectionHead("Active tasks", "work.log_tail")]);
  if (work.tasks && work.tasks.length) {
    work.tasks.forEach(function (t) {
      const row = el("div", { class: "task-row" });
      const statusCls = "status-pill status-" + (t.status || "todo").toLowerCase();
      row.appendChild(el("div", { class: "head" }, [
        pathLink(t.title || t.file, t.file, "title"),
        t.needs_human ? el("span", { class: "nh-count" }, [t.needs_human + " NEEDS-HUMAN"]) : null,
        el("span", { class: statusCls }, [t.status || "todo"])
      ]));
      if (t.next_action) row.appendChild(el("div", { class: "next-action" }, [el("span", { class: "k" }, ["Next: "]), t.next_action]));
      tasksCard.appendChild(row);
    });
  } else {
    tasksCard.appendChild(el("div", { class: "empty-state" }, ["no active tasks"]));
  }
  panel.appendChild(tasksCard);

  // -- proposals: ideas parked for later (state/proposals.jsonl, statectl proposal ...) --------
  const props = work.proposals || { open: 0, resolved: 0, items: [] };
  const propCard = el("div", { class: "card" }, [sectionHead("Proposals (" + (props.open || 0) + " open)", "work.proposals")]);
  if (props.items && props.items.length) {
    props.items.forEach(function (p) {
      const row = el("div", { class: "task-row" });
      row.appendChild(el("div", { class: "head" }, [
        el("span", { class: "proposal-id" }, [p.id || ""]),
        el("span", { class: "title" }, [p.text || ""]),
        el("span", { class: "status-pill status-" + (p.status || "open") }, [p.status || "open"])
      ]));
      row.appendChild(el("div", { class: "next-action" }, [
        el("span", { class: "k" }, ["kind: "]), (p.kind || "-") + " · ",
        el("span", { class: "k" }, ["source: "]), p.source || "-"
      ]));
      if (p.note) row.appendChild(el("div", { class: "next-action" }, [el("span", { class: "k" }, ["Note: "]), p.note]));
      if (p.status === "open") {
        row.appendChild(copyBox('python3 .claude/tools/statectl.py proposal resolve ' + JSON.stringify(p.id)
          + ' --as planned --note "<where it was planned>"', "or --as rejected --note \"<why not>\""));
      }
      propCard.appendChild(row);
    });
  } else {
    propCard.appendChild(el("div", { class: "empty-state" }, ["no proposals: park an out-of-scope idea with statectl proposal add"]));
  }
  panel.appendChild(propCard);

  const logCard = el("div", { class: "card" }, [sectionHead("Project log", "work.log_tail")]);
  if (work.log_tail && work.log_tail.length) {
    work.log_tail.slice().reverse().forEach(function (e) {
      logCard.appendChild(el("div", { class: "log-row" }, [
        el("span", { class: "date" }, [e.date || ""]),
        el("span", { class: "type" }, [e.type || ""]),
        el("span", {}, [(e.title ? e.title + " - " : "") + (e.summary || "")])
      ]));
    });
  } else {
    logCard.appendChild(el("div", { class: "empty-state" }, ["log is empty"]));
  }
  panel.appendChild(logCard);

  const watchCard = el("div", { class: "card" }, [sectionHead("Watch-outs", "work.log_tail")]);
  if (work.watch_outs && work.watch_outs.length) {
    work.watch_outs.forEach(function (w) { watchCard.appendChild(el("div", { class: "watch-out-row" }, [w])); });
  } else {
    watchCard.appendChild(el("div", { class: "empty-state" }, ["no active watch-outs"]));
  }
  panel.appendChild(watchCard);

  const researchCard = el("div", { class: "card" }, [sectionHead("Research index", "work.log_tail")]);
  if (work.research && work.research.length) {
    work.research.forEach(function (r) {
      researchCard.appendChild(el("div", { class: "research-row" }, [pathLink(r.title || r.file, r.file)]));
    });
  } else {
    researchCard.appendChild(el("div", { class: "empty-state" }, ["no research notes yet"]));
  }
  panel.appendChild(researchCard);
}

/* ============================================================================================
 * chrome: tabs, theme toggle, header, footer, polling
 * ========================================================================================== */

function renderChrome() {
  document.getElementById("project-name").textContent = (DATA.project && DATA.project.name) || "console";
  const gen = document.getElementById("generated-at");
  gen.textContent = "generated " + (DATA.generated_at || "?") + (DATA.project && DATA.project.system_version ? (" · v" + DATA.project.system_version) : "");

  // The all-time token total, right side of the footer. Computed from the payload's rollup
  // aggregation (already summed server-side, so this costs nothing at render time). Shown
  // instead of a cost figure when billing makes cost not applicable.
  const tokEl = document.getElementById("token-total");
  if (tokEl) {
    const total = (DATA.tokens && DATA.tokens.total) || {};
    let sum = 0;
    ["input", "output", "cache_read", "cache_creation"].forEach(function (k) {
      if (typeof total[k] === "number") sum += total[k];
    });
    const fmtTok = sum >= 1e9 ? (sum / 1e9).toFixed(1) + "B"
      : sum >= 1e6 ? (sum / 1e6).toFixed(1) + "M"
      : sum >= 1e3 ? (sum / 1e3).toFixed(1) + "K" : String(sum);
    const cost = DATA.tokens && DATA.tokens.cost_known
      ? " · $" + Number(DATA.tokens.cost_usd).toFixed(2)
      : (DATA.tokens && DATA.tokens.billing === "subscription" ? " · in plan" : "");
    tokEl.textContent = sum > 0 ? (" · Σ " + fmtTok + " tokens" + cost) : "";
  }

  // Quiet, inspectable pointers home: the repo (derived from the git remote, so an adopted
  // project shows ITS repo, not this one's), the tour and the manual. Navigation anchors
  // only - the page still fetches nothing external.
  const linksEl = document.getElementById("footer-links");
  if (linksEl && !linksEl.childElementCount) {
    const p = DATA.project || {};
    const items = [];
    if (p.repo_url) {
      items.push([p.repo_url, p.repo_url.replace(/^https?:\/\/(www\.)?/, ""), "link-repo"]);
    }
    if (p.tour_url) items.push([p.tour_url, "tour", "link-tour"]);
    if (p.manual_url) items.push([p.manual_url, "partner guide", "link-guide"]);
    items.forEach(function (it, i) {
      if (i > 0) linksEl.appendChild(document.createTextNode(" · "));
      const a = document.createElement("a");
      a.href = it[0]; a.textContent = it[1]; a.className = it[2];
      a.target = "_blank"; a.rel = "noopener";
      linksEl.appendChild(a);
    });
  }

  // The published demo gets a slim banner linking the three surfaces: demo, tour, repo.
  // Only when DATA.demo - the real console you run locally stays banner-free.
  if (DATA.demo && !document.getElementById("demo-banner")) {
    // Demo-only branding: the published snapshot lives next to docs/assets/, the local
    // console does not - so both the favicon and the banner logo stay behind DATA.demo.
    const icon = document.createElement("link");
    icon.rel = "icon"; icon.type = "image/png"; icon.href = "../assets/favicon.png";
    document.head.appendChild(icon);
    const bar = document.createElement("div");
    bar.id = "demo-banner";
    const logo = document.createElement("img");
    logo.className = "demo-logo"; logo.src = "../assets/logo-small.png"; logo.alt = "";
    bar.appendChild(logo);
    bar.appendChild(document.createTextNode("You are viewing a demo snapshot of the console. "));
    const mk = function (href, text, blank) {
      const a = document.createElement("a");
      a.href = href; a.textContent = text;
      if (blank) { a.target = "_blank"; a.rel = "noopener"; }
      return a;
    };
    bar.appendChild(mk("../index.html", "Take the tour", false));
    if (DATA.project && DATA.project.repo_url) {
      bar.appendChild(document.createTextNode(" · "));
      bar.appendChild(mk(DATA.project.repo_url, "View the repo", true));
    }
    if (DATA.project && DATA.project.manual_url) {
      bar.appendChild(document.createTextNode(" · "));
      bar.appendChild(mk(DATA.project.manual_url, "Partner guide", true));
    }
    document.body.insertBefore(bar, document.body.firstChild);
  }
  const warn = document.getElementById("warnings-list");
  warn.textContent = (DATA.warnings && DATA.warnings.length) ? DATA.warnings.join(" · ") : "";

  const badge = document.getElementById("mode-badge");
  const dot = document.getElementById("pulse-dot");
  if (DATA.demo) {
    // A published demo snapshot (e.g. on GitHub Pages): there is no server behind it, so it
    // must say what it is rather than sit on "connecting" while polls 404 into backoff.
    badge.textContent = "demo snapshot";
    badge.className = "badge badge-static";
    dot.className = "pulse-dot";
  } else if (location.protocol === "file:") {
    badge.textContent = "static snapshot";
    badge.className = "badge badge-static";
    dot.className = "pulse-dot";
  } else if (DATA.mode === "live") {
    badge.textContent = "live";
    badge.className = "badge badge-live";
    dot.className = "pulse-dot live";
  } else {
    badge.textContent = "connecting…";
    badge.className = "badge badge-static";
    dot.className = "pulse-dot";
  }
  renderLifecycleBadge();
}

// The work-mode / lifecycle-phase dial (DATA.now.lifecycle, folded by _lib.lifecycle_state -
// the same reader the SessionStart hook prints). The hover title carries the phase contract.
function renderLifecycleBadge() {
  const lb = document.getElementById("lifecycle-badge");
  if (!lb) return;
  const life = (DATA.now && DATA.now.lifecycle) || {};
  const modeLabel = life.mode_label || "Freestyle";
  lb.textContent = modeLabel + " · " + (life.phase_label || "no phase");
  lb.className = "badge badge-lifecycle" + (life.organised ? " is-organised" : "");
  const tip = ["work mode: " + modeLabel + (life.mode_set ? "" : " (unset = freestyle)"),
               "phase: " + (life.phase || "unset") + (life.phase_since ? " since " + life.phase_since : "")];
  (life.contract || []).forEach(function (line) { tip.push("- " + line); });
  if (!life.organised) tip.push("no phase contract or exit checks in freestyle");
  lb.title = tip.join("\n");
}

function renderAll() {
  renderChrome();
  renderNow();
  renderMap();
  renderStory();
  renderWork();
}

function initTabs() {
  const btns = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
  btns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      const target = btn.dataset.tab;
      btns.forEach(function (b) { b.classList.toggle("active", b === btn); b.setAttribute("aria-selected", b === btn ? "true" : "false"); });
      Array.prototype.slice.call(document.querySelectorAll(".panel")).forEach(function (p) {
        p.classList.toggle("active", p.dataset.panel === target);
      });
      if (target === "map") { const panel = document.getElementById("panel-map"); if (panel._mapRedraw) panel._mapRedraw(); }
    });
  });
}

function initTheme() {
  const btn = document.getElementById("theme-toggle");
  btn.addEventListener("click", function () {
    const cur = document.documentElement.getAttribute("data-theme");
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const effectiveDark = cur ? cur === "dark" : prefersDark;
    const next = effectiveDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("console-theme", next); } catch (e) { /* private mode / file:// - toggle still works this session */ }
  });
}

/* -- live polling: only when served over http(s); file:// stays a static snapshot ---------- */

const POLL_ACTIVE_SECONDS = 5;   // mirrors config/console.json's default; edit both if you change it
const POLL_IDLE_SECONDS = 30;
const ACTIVE_WINDOW_MINUTES = 10;
const BACKOFF_SEQUENCE = [5, 10, 20, 40, 60];

let pollTimer = null;
let backoffIndex = -1;

function isLiveCapable() {
  if (DATA.demo) return false;  // a demo snapshot has no server; polling would 404 forever
  return location.protocol === "http:" || location.protocol === "https:";
}

function nextPollSeconds(data) {
  const age = data && data.now && data.now.heartbeat_age_seconds;
  if (typeof age === "number" && age < ACTIVE_WINDOW_MINUTES * 60) return POLL_ACTIVE_SECONDS;
  return POLL_IDLE_SECONDS;
}

function scheduleNext(seconds) {
  clearTimeout(pollTimer);
  if (document.hidden) return; // paused entirely while hidden; visibilitychange resumes it
  pollTimer = setTimeout(pollOnce, seconds * 1000);
}

function pollOnce() {
  fetch("/live/console.json", { cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("bad status " + res.status);
    return res.json();
  }).then(function (data) {
    backoffIndex = -1;
    Object.keys(data).forEach(function (k) { DATA[k] = data[k]; });
    renderAll();
    scheduleNext(nextPollSeconds(data));
  }).catch(function () {
    backoffIndex = Math.min(backoffIndex + 1, BACKOFF_SEQUENCE.length - 1);
    scheduleNext(BACKOFF_SEQUENCE[backoffIndex]);
  });
}

function initPolling() {
  if (!isLiveCapable()) return;
  pollOnce();
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearTimeout(pollTimer); }
    else { pollOnce(); }
  });
}

/* -- system monitor: opt-in live metrics on their own slower poll -------------------------- */
/* Sampling costs the server real work (counter reads, nvidia-smi), so this loop runs at 15s,
   independent of the payload poll, and retires itself permanently on 404 (monitor off). */

const SYSMON = { sample: null, off: false, timer: null };

function sysmonGB(bytes) { return (bytes / 1073741824).toFixed(1); }

function renderSysmon(s) {
  const bits = [];
  if (typeof s.cpu_percent === "number") bits.push("CPU " + Math.round(s.cpu_percent) + "%");
  else if (typeof s.load1 === "number") bits.push("load " + s.load1);
  if (s.ram && s.ram.total) {
    bits.push("RAM " + sysmonGB(s.ram.used || 0) + " / " + sysmonGB(s.ram.total) + " GB");
  }
  if (s.gpu) {
    if (typeof s.gpu.util_percent === "number") bits.push("GPU " + Math.round(s.gpu.util_percent) + "%");
    if (s.gpu.vram_total) {
      bits.push("VRAM " + sysmonGB(s.gpu.vram_used || 0) + " / " + sysmonGB(s.gpu.vram_total) + " GB");
    }
  }
  const card = el("div", { class: "card" }, [sectionHead("System", "now")]);
  card.appendChild(el("div", { class: "kv-row sysmon-row" },
                      [bits.length ? bits.join("  ·  ") : "no metrics available on this platform"]));
  return card;
}

function sysmonPoll() {
  if (SYSMON.off) return;
  if (document.hidden) { SYSMON.timer = setTimeout(sysmonPoll, 15000); return; }
  fetch("/live/system.json", { cache: "no-store" }).then(function (res) {
    if (res.status === 404) { SYSMON.off = true; return null; }  // monitor disabled: stop for good
    if (!res.ok) throw new Error("bad status " + res.status);
    return res.json();
  }).then(function (data) {
    if (data) { SYSMON.sample = data; renderNow(); }
    if (!SYSMON.off) SYSMON.timer = setTimeout(sysmonPoll, 15000);
  }).catch(function () {
    SYSMON.timer = setTimeout(sysmonPoll, 30000);
  });
}

function initSysmon() {
  if (!isLiveCapable()) return;
  sysmonPoll();
}

initTabs();
initTheme();
renderAll();
initPolling();
initSysmon();
</script>
