<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-claude-iff console</title>
<script>
// Applied before first paint so a saved theme choice never flashes the wrong palette.
(function () {
  try {
    var t = localStorage.getItem('console-theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) { /* localStorage unavailable (private mode, file://, etc.) - default theme stands */ }
})();
</script>
<style>
/* ---------------------------------------------------------------- reset */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
a { color: inherit; }
table { border-collapse: collapse; width: 100%; }

/* ---------------------------------------------------------------- theme tokens
   Full light palette lives on bare :root. Dark overrides are defined TWICE:
   once for automatic prefers-color-scheme, once for the explicit data-theme
   toggle - so both the OS default and the manual toggle work in both
   directions. No color is ever defined only inside a media/attr block. */
:root {
  --bg: #f4f5f7;
  --bg-elevated: #ffffff;
  --bg-sunken: #e9ebef;
  --text: #1b1f24;
  --text-dim: #5b6270;
  --border: #d8dce2;
  --border-strong: #b7bdc7;
  --accent: #3272c8;
  --accent-contrast: #ffffff;
  --shadow: 0 1px 3px rgba(20, 22, 26, 0.12);

  --color-agent: #d97a2b;
  --color-code: #3272c8;
  --color-data: #4a8f4e;
  --color-human: #b8922e;
  --color-external: #8a8f98;

  /* connection colors: monochrome, deliberately outside the node-kind palette so a line can
     never be misread as a node's role. write = black solid (the strongest claim), read = the
     same black dashed (the dash is the differentiator), invoke = gray solid. */
  --edge-write: #1b1f24;
  --edge-read: #1b1f24;
  --edge-invoke: #8a8f98;

  --sev0-bg: #c0392b;
  --sev0-fg: #ffffff;
  --sev1-bg: #d97a2b;
  --sev1-fg: #ffffff;
  --sev2-bg: #b8922e;
  --sev2-fg: #1b1f24;
  --sev3-bg: #8a8f98;
  --sev3-fg: #ffffff;

  --live-color: #2e9e4a;
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --bg-elevated: #1c1f24;
    --bg-sunken: #101215;
    --text: #e6e8eb;
    --text-dim: #9aa1ac;
    --border: #2b2f36;
    --border-strong: #3b414b;
    --accent: #6ea8f0;
    --edge-write: #e6e8eb;
    --edge-read: #e6e8eb;
    --edge-invoke: #9aa0a8;
    --accent-contrast: #0b1220;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
  }
}

:root[data-theme="dark"] {
  --bg: #14161a;
  --bg-elevated: #1c1f24;
  --bg-sunken: #101215;
  --text: #e6e8eb;
  --text-dim: #9aa1ac;
  --border: #2b2f36;
  --border-strong: #3b414b;
  --accent: #6ea8f0;
  --edge-write: #e6e8eb;
  --edge-read: #e6e8eb;
  --edge-invoke: #9aa0a8;
  --accent-contrast: #0b1220;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------------------------------------------------------------- base layout */
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
}

#app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@media (min-width: 960px) {
  #app { max-width: 1080px; }
  .grid-2-wide { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}

#topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pulse-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--text-dim);
  flex: 0 0 auto;
}
.pulse-dot.live {
  background: var(--live-color);
  box-shadow: 0 0 0 0 rgba(46, 158, 74, 0.6);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(46, 158, 74, 0.55); }
  70% { box-shadow: 0 0 0 6px rgba(46, 158, 74, 0); }
  100% { box-shadow: 0 0 0 0 rgba(46, 158, 74, 0); }
}

.badge {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--text-dim);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.badge.badge-static { color: var(--sev1-bg); border-color: var(--sev1-bg); }
.badge.badge-live { color: var(--live-color); border-color: var(--live-color); }
/* the work-mode / lifecycle-phase dial; NOT the live/static badge beside it */
.badge.badge-lifecycle { cursor: help; }
.badge.badge-lifecycle.is-organised { color: var(--accent); border-color: var(--accent); }

#tabs { display: flex; gap: 2px; margin-left: auto; }
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 6px 10px;
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-dim);
}
.tab-btn:hover { background: var(--bg-sunken); }
.tab-btn.active { color: var(--accent); background: var(--bg-sunken); border-color: var(--border); }

#theme-toggle {
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 30px; height: 30px;
  cursor: pointer;
  flex: 0 0 auto;
}

#panels { flex: 1 1 auto; padding: 12px; }
.panel { display: none; }
.panel.active { display: block; }

#token-total { color: var(--sev1-bg); font-weight: 600; }
#footer-links { white-space: nowrap; }
#footer-links a { text-decoration: none; opacity: 0.9; }
#footer-links a:hover { text-decoration: underline; opacity: 1; }
#footer-links a.link-repo { color: var(--accent); }
#footer-links a.link-tour { color: var(--live-color); }
#footer-links a.link-guide { color: var(--sev2-bg); }
#demo-banner {
  background: var(--bg-sunken); border-bottom: 1px solid var(--border);
  color: var(--text-dim); font-size: 12.5px; text-align: center; padding: 7px 12px;
}
#demo-banner a { color: var(--accent); }
#demo-banner .demo-logo { height: 16px; width: auto; vertical-align: -3px; margin-right: 6px; }
.sysmon-row { font-variant-numeric: tabular-nums; color: var(--text-dim); }
#statusbar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
}
#warnings-list { color: var(--sev1-bg); }

/* ---------------------------------------------------------------- cards / sections */
.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
  margin-bottom: 12px;
}
.card h2 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.card h3 { font-size: 13px; margin-bottom: 6px; }

.freshness-chip {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  white-space: nowrap;
}
.freshness-chip.is-live { color: var(--live-color); border-color: var(--live-color); }

.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-word; }

.pointer-box {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--bg-sunken);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  white-space: pre-wrap;
  word-break: break-word;
}

.kv-row { display: flex; gap: 10px; padding: 3px 0; font-size: 13px; }
.kv-row .k { color: var(--text-dim); min-width: 90px; flex: 0 0 auto; }
.kv-row .v { min-width: 0; }

.empty-state {
  color: var(--text-dim);
  font-style: italic;
  padding: 16px 4px;
  text-align: center;
}

/* -- chips: kind + sev band -- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  color: #fff;
  white-space: nowrap;
}
.chip-agent { background: var(--color-agent); }
.chip-code { background: var(--color-code); }
.chip-data { background: var(--color-data); }
.chip-human { background: var(--color-human); color: #1b1f24; }
.chip-external { background: var(--color-external); }

.sev-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.sev-chip {
  display: inline-flex; align-items: baseline; gap: 5px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
}
.sev-chip .n { font-size: 15px; }
.sev-chip.sev0 { background: var(--sev0-bg); color: var(--sev0-fg); box-shadow: 0 0 0 2px var(--sev0-bg), 0 0 8px rgba(192,57,43,0.6); }
.sev-chip.sev0.has { animation: sev0-throb 1.6s ease-in-out infinite; }
@keyframes sev0-throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.sev-chip.sev1 { background: var(--sev1-bg); color: var(--sev1-fg); }
.sev-chip.sev2 { background: var(--sev2-bg); color: var(--sev2-fg); }
.sev-chip.sev3 { background: var(--sev3-bg); color: var(--sev3-fg); }

.needs-human-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px;
}
.needs-human-row:first-of-type { border-top: none; }
.needs-human-row .title { flex: 1 1 auto; min-width: 0; }

/* -- needs-human: humanized item body + the copy-context bridge -- */
.nh-hint { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.nh-item { border-top: 1px solid var(--border); padding: 6px 0; }
.nh-item:first-child { border-top: none; }
.nh-copy-row { margin-top: 4px; }

/* -- journal feed -- */
.journal-item { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.journal-item:first-child { border-top: none; }
.journal-item .ts { color: var(--text-dim); font-family: var(--mono); font-size: 11px; flex: 0 0 auto; white-space: nowrap; }
.journal-item .action { font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--accent); flex: 0 0 auto; }

/* -- token grid -- */
.token-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 960px) { .token-grid { grid-template-columns: repeat(4, 1fr); } }
.token-cell { background: var(--bg-sunken); border-radius: var(--radius); padding: 8px 10px; }
.token-cell .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; }
.token-cell .value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* -- copy box -- */
.copy-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-sunken); border: 1px dashed var(--border-strong);
  border-radius: var(--radius); padding: 6px 8px; margin-top: 6px;
}
.copy-box code { font-family: var(--mono); font-size: 11.5px; flex: 1 1 auto; overflow-x: auto; white-space: pre; }
.copy-btn {
  flex: 0 0 auto; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 11px; font-weight: 600;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* -- progress panel (top of NOW): DATA.progress, the model `statectl progress` prints -- */
.pg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 6px; }
.pg-mid { font-family: var(--mono); font-weight: 700; }
.pg-mtitle { color: var(--text-dim); font-size: 12.5px; min-width: 0; }
.pg-bar { position: relative; height: 12px; border-radius: 999px; overflow: hidden;
  background: var(--bg-sunken); border: 1px solid var(--border); }
.pg-bar .pg-fill { position: absolute; top: 0; left: 0; bottom: 0; background: var(--accent); }
.pg-bar.is-full .pg-fill { background: var(--color-data); }
.pg-bar.pg-mini { height: 7px; }
.pg-figures { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin: 5px 0 2px;
  font-size: 12.5px; font-variant-numeric: tabular-nums; }
.pg-figures .pg-pct { font-size: 16px; font-weight: 700; }
.pg-basis, .pg-meta { font-size: 11px; color: var(--text-dim); }
.pg-meta { margin-top: 2px; }
.pg-group { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-dim); margin: 10px 0 2px; }
.pg-task { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 80px 4.2em 6.2em; align-items: center;
  gap: 2px 8px; padding: 4px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
.pg-task .status-pill { justify-self: end; }
@media (max-width: 520px) { .pg-task { grid-template-columns: 2.6em minmax(0, 1fr) 44px 3.4em 5.8em; gap: 2px 5px; } }
.pg-task .pg-tid { font-family: var(--mono); font-weight: 700; }
.pg-task .pg-ttitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-task .pg-count { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.pg-task .pg-agent { grid-column: 2 / -1; font-size: 11px; color: var(--text-dim); }
.pg-line { font-size: 12.5px; padding: 6px 0 0; margin-top: 6px; border-top: 1px solid var(--border); }

/* ---------------------------------------------------------------- MAP tab */
.analysis-info { border: 1px dashed var(--border-strong); border-radius: 9px;
  padding: 10px 14px; margin-bottom: 12px; font-size: 12.5px; color: var(--text-dim); }
.analysis-info p { margin: 2px 0 8px; line-height: 1.55; }
.analysis-info .ai-title { font-weight: 700; color: var(--text); font-size: 11.5px;
  text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px;
  font-size: 12px; color: var(--text-dim); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend-swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend-swatch.kind-agent { background: var(--color-agent); }
.legend-swatch.kind-code { background: var(--color-code); }
.legend-swatch.kind-data { background: var(--color-data); }
.legend-swatch.kind-human { background: var(--color-human); }
.legend-swatch.kind-external { background: var(--color-external); }
.legend-swatch.kind-folder { background: var(--color-external); }
.legend-swatch.kind-file { background: var(--color-code); }
.legend-line { width: 24px; height: 0; display: inline-block; border-top: 2.5px solid; }
.legend-line.edge-key-invoke { border-color: var(--edge-invoke); }
.legend-line.edge-key-write { border-color: var(--edge-write); }
.legend-line.edge-key-read { border-color: var(--edge-read); border-top-style: dashed; }
.legend-line.edge-key-other { border-color: var(--color-external); }
.legend-line.is-dashed { border-top-style: dashed; }
.legend-line.is-solid { border-top-style: solid; }
.map-toolbar { display: flex; gap: 6px; margin-bottom: 10px; }
.view-btn {
  background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 12px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-dim);
}
.view-btn.active { color: var(--accent); border-color: var(--accent); background: var(--bg-elevated); }
/* -- scope switcher: cards (map.json) plus one button per architecture.json scope -- */
.map-scope-switch { flex-wrap: wrap; }
.map-scope-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }

.map-canvas { position: relative; }
.map-edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.map-layer { position: relative; z-index: 1; margin-bottom: 14px; }
.map-layer-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.map-layer-head h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
.map-layer-head .blurb { font-size: 11px; color: var(--text-dim); }
.map-layer.is-unplaced .map-layer-head h3 { color: var(--text-dim); }
.map-nodes { display: flex; flex-wrap: wrap; gap: 8px; }
[data-view="backbone"] .map-nodes { display: none; }
[data-view="backbone"] .map-layer-head .blurb { display: inline; }

.map-node {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-elevated); border: 2px solid var(--border-strong);
  border-radius: var(--radius); padding: 6px 10px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; max-width: 220px;
}
.map-node:hover { border-color: var(--accent); }
.map-node .swatch { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.map-node .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-node .glyph { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 3px; }

.edge-control { stroke: var(--color-external); stroke-width: 1.5; fill: none; }
.edge-feedback { stroke: var(--color-external); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.edge-write { stroke: var(--edge-write); stroke-width: 1.6; fill: none; }
.edge-read { stroke: var(--edge-read); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.edge-invoke { stroke: var(--edge-invoke); stroke-width: 1.4; fill: none; }
.edge-human { stroke: var(--color-human); stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.edge-validates { stroke: var(--color-code); stroke-width: 1.6; stroke-dasharray: 1 4; stroke-linecap: round; fill: none; }
/* a spec edge's own style wins over its label's default dash; its label sits at the midpoint */
.edge-dashed { stroke-dasharray: 6 4; }
.edge-solid { stroke-dasharray: none; }
.edge-label { font-size: 10px; font-family: var(--mono); fill: var(--text-dim);
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.editor-link { margin-left: 10px; font-size: 12px; }

dialog#node-dialog {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-elevated); color: var(--text);
  max-width: min(90vw, 480px); box-shadow: var(--shadow); padding: 0;
}
dialog#node-dialog::backdrop { background: rgba(0,0,0,0.4); }
.dialog-inner { padding: 14px; }
.dialog-inner h3 { font-size: 15px; margin-bottom: 6px; }
.dialog-section { margin-top: 8px; }
.dialog-section .label { font-size: 10px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em; margin-bottom: 3px; }
.dialog-close {
  margin-top: 12px; background: var(--bg-sunken); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; font-weight: 600;
}
.rel-tag { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--bg-sunken); border-radius: 4px; padding: 1px 6px; margin: 2px 3px 0 0; }

/* -- focus mode: first click on a node fades everything but it and its neighbors -- */
.map-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.map-node { transition: opacity .15s ease, border-color .15s ease, box-shadow .15s ease; }
.map-node.is-faded-node { opacity: .15; }
.map-node.is-focus-node { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); z-index: 5; }
.map-node.is-neighbor-node { z-index: 4; }
.map-edges line { transition: opacity .15s ease; }
.map-edges line.is-faded-edge { opacity: .15; }
.map-edges line.is-focus-edge { stroke-width: 2.4; }

/* -- context list: guides and rules, derived entries rather than map nodes -- */
.ctx-summary { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.ctx-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
.ctx-row .ctx-path { flex: 1 1 16em; min-width: 0; }
.ctx-row .ctx-kind { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--accent); }
.ctx-row .ctx-scope { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
.ctx-row .ctx-lines { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 11px; }
.ctx-row .ctx-findings { font-size: 11px; font-weight: 700; color: var(--sev1-bg); }

/* ---------------------------------------------------------------- STORY tab */
.clock-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
.clock-btn {
  background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 12px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-dim);
}
.clock-btn.active { color: var(--accent); border-color: var(--accent); background: var(--bg-elevated); }

.story-lane { margin-bottom: 16px; }
.story-lane h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; color: var(--text-dim); }
.sparkline-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 960px) { .sparkline-grid { grid-template-columns: 1fr 1fr; } }
.sparkline-card { background: var(--bg-sunken); border-radius: var(--radius); padding: 8px 10px; }
.sparkline-card .sp-label { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 4px; }
.sparkline-card svg { width: 100%; height: 44px; display: block; }
.sp-line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.sp-area { fill: var(--accent); opacity: 0.12; stroke: none; }
.sp-marker { stroke: var(--sev1-bg); stroke-width: 1; }

/* ---------------------------------------------------------------- WORK tab */
.task-row { border-top: 1px solid var(--border); padding: 8px 0; }
.task-row:first-child { border-top: none; }
.task-row .head { display: flex; align-items: center; gap: 8px; }
.task-row .title { font-weight: 700; flex: 1 1 auto; min-width: 0; }
.status-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text-dim); }
.status-pill.status-doing { color: var(--accent); border-color: var(--accent); }
.status-pill.status-done { color: var(--color-data); border-color: var(--color-data); }
.status-pill.status-blocked { color: var(--sev0-bg); border-color: var(--sev0-bg); }
.status-pill.status-open { color: var(--accent); border-color: var(--accent); }
.status-pill.status-planned { color: var(--color-data); border-color: var(--color-data); }
.proposal-id { font-family: var(--mono); font-size: 11px; color: var(--text-dim); flex: 0 0 auto; }
.nh-count { font-size: 11px; font-weight: 700; color: var(--sev1-bg); }
.next-action { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
.next-action .k { color: var(--text); font-weight: 600; }

.log-row, .research-row { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
.log-row:first-child, .research-row:first-child { border-top: none; }
.log-row .date { color: var(--text-dim); font-family: var(--mono); font-size: 11px; flex: 0 0 auto; white-space: nowrap; }
.log-row .type { flex: 0 0 auto; font-weight: 700; text-transform: uppercase; font-size: 10px; color: var(--accent); }
.watch-out-row { padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 6px; }
.watch-out-row:first-child { border-top: none; }
.watch-out-row::before { content: "⚠"; color: var(--sev1-bg); flex: 0 0 auto; }
.research-row a { color: var(--accent); text-decoration: none; }
.research-row a:hover { text-decoration: underline; }
</style>
</head>

L): Cview drives, not the lead.","exists":true,"flows":[],"glyphs":[],"id":"tool.statectl","kind":"code","layer":"MEMORY","package":null,"path":".claude/tools/statectl.py","title":"Statectl"},{"description":"The ritual registry: which steps /project-memory runs, in which phase, in order.","exists":true,"flows":[],"glyphs":[],"id":"config.memory","kind":"data","layer":"MEMORY","package":null,"path":".claude/config/memory.json","title":"Memory"},{"description":"The three mechanisms that keep home-repo-only content out of the adoption kits (structural placement outside .claude/, the distribution.enabled knob, distctl content normalization) and the decision rule for picking one.","exists":true,"flows":[],"glyphs":[],"id":"reference.distribution-boundary","kind":"data","layer":"MEMORY","package":null,"path":".claude/reference/distribution-boundary.md","title":"Distribution Boundary"},{"description":"Derived human-readable resume note, projected from the journal.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.handoff","kind":"data","layer":"MEMORY","package":null,"path":".claude/state/HANDOFF.md","title":"Handoff note"},{"description":"Append-only truth: one action vocabulary, shared by every writer and the projector.","exists":true,"flows":[],"glyphs":["append-only"],"id":"store.journal","kind":"data","layer":"MEMORY","package":null,"path":".claude/state/journal.jsonl","title":"Journal"},{"description":"Mistakes distilled into mechanical prevention rules, rendered in console WORK.","exists":true,"flows":[],"glyphs":["append-only"],"id":"store.lessons","kind":"data","layer":"MEMORY","package":null,"path":".claude/LESSONS.jsonl","title":"Lessons"},{"description":"Device identity: a salted fingerprint (sha256 of user|host, truncated to 12 hex chars) plus a human-chosen alias. No username or hostname is stored. Single writer: `statectl.py device`; the session-start hook only reads and nags via `_lib.machine_check()`.","exists":true,"flows":[],"glyphs":[],"id":"store.machine","kind":"data","layer":"MEMORY","package":null,"path":".claude/state/machine.json","title":"Machine identity"},{"description":"Append-only decision/deliverable/milestone/mistake/tooling log.","exists":true,"flows":[],"glyphs":["append-only"],"id":"store.project_log","kind":"data","layer":"MEMORY","package":null,"path":".claude/Project-log.jsonl","title":"Project log"},{"description":"Derived point-in-time session snapshot, projected from the journal.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.session","kind":"data","layer":"MEMORY","package":null,"path":".claude/state/session.json","title":"Session snapshot"},{"description":"Implements ONE task card (a .claude/tasks/ file with a Definition of done and one Test command) inside a git worktree the lead created, in the fableous-orchestrated mode. Use when the lead dispatches a task with a filled builder brief and a worktree name. Writes code and tests in its worktree only, never commits, and hands back a validated JSON envelope. NOT for planning, research, review or merging.","exists":true,"flows":[],"glyphs":[],"id":"agent.builder","kind":"agent","layer":"GOVERN","package":null,"path":".claude/agents/builder.md","title":"builder"},{"description":"Read-only researcher for the lead in the fableous-orchestrated mode - codebase surveys, \"where is X and who calls it\", docs and web lookups, a quick check of one fact. Returns findings with exact paths and line numbers, cheaply, so the lead's context stays for decisions. Never edits anything. NOT for implementing (builder) and NOT for checking a finished task (verifier).","exists":true,"flows":[],"glyphs":[],"id":"agent.scout","kind":"agent","layer":"GOVERN","package":null,"path":".claude/agents/scout.md","title":"scout"},{"description":"Adversarial quality-check agent. Given a claim, a deliverable, or done-criteria, independently verify it against reality (run tests, read outputs, recompute numbers) and return a verdict as a handshake envelope. Use after substantial work products, before reporting \"done\" on multi-step tasks, or whenever a skill's QC step calls for independent verification. NOT for producing or fixing work, it only checks.","exists":true,"flows":[],"glyphs":[],"id":"agent.verifier","kind":"agent","layer":"GOVERN","package":null,"path":".claude/agents/verifier.md","title":"verifier"},{"description":"handoff-guard.sh - SubagentStart / SubagentStop, fableous-orchestrated mode only. SubagentStart: records when the agent began (state/orchestration.json) and resets the lead's delegation-nudge counter, because a dispatch is exactly what the nudge asks for. SubagentStop: a `builder` that is stopping without a valid handoff envelope written since it started, for an open builder stub, is sent back ONCE to write it ({\"decision\": \"block\", \"reason\": ...}, the documented Stop/SubagentStop blocking output). When the harness says stop_hook_active (this stop was already sent back once), the builder stops: the hook can never loop. Every other agent type stops untouched. BEST EFFORT, on purpose. The payload fields read here (hook_event_name, agent_type, agent_id, agent_transcript_path, stop_hook_active) are what the harness sends today and may change; a missing field reads as \"cannot tell\" and the agent stops normally. The HARD guarantee is not this hook: it is `statectl task <id> --status done`, which in fableous-orchestrated refuses without a valid envelope whose tests passed. LAW 2, telemetry half: FAILS OPEN. A malformed payload, a missing python3 or any internal error means no output and exit 0. In freestyle and guided-solo it does nothing at all. The payload goes through a temp file, not an environment variable: a SubagentStop payload can carry the agent's whole last message, and an env string is capped (see policy-gate.sh).","exists":true,"flows":[],"glyphs":[],"id":"hook.handoff-guard","kind":"code","layer":"GOVERN","package":null,"path":".claude/hooks/handoff-guard.sh","title":"Handoff Guard"},{"description":"policy-gate.sh - PreToolUse gate on Write|Edit|NotebookEdit|Bash. LAW 2, gate half: THIS HOOK FAILS CLOSED. If the policy file is unreadable or malformed, writes under the hardcoded fallback tree are DENIED and everything else is allowed - a broken policy can neither expose the protected tree nor brick the whole session. Two rings: 1. The record (RECORD_ROOT and .claude-iff/) is write-denied to EVERY identity, including the main session. It is written only by the capture hook's append and by obsctl. This is what \"append-only\" actually rests on; the committed anchor is what makes it evidence. 2. The protected tree (.claude/hooks, config, agents, protocols, settings) is main-session only. A sub-agent must never be able to edit the gate that polices it or the ritual registry it runs under. Identity comes from the payload's agent_type/agent_name; absent means the main session. A third identity, the worker (main identity whose root is a linked worktree, _lib.worktree_info): its own git and protected-tree copy stay allowed, statectl dispatch/accept are refused. A 'wstate' ring guards .claude/state/ of worktree copies (handshakes/ carved out) for every identity.","exists":true,"flows":[],"glyphs":[],"id":"hook.policy-gate","kind":"code","layer":"GOVERN","package":null,"path":".claude/hooks/policy-gate.sh","title":"Policy Gate"},{"description":"post-write-validate.sh - PostToolUse gate on Write|Edit. The generic GOVERN gate. LAW 2, gate half: FAILS CLOSED. A structured file under .claude/ that no longer parses is blocked on the spot (exit 2, message to the model) so the agent fixes its own bad write while it still has the context - rather than the corruption surfacing three sessions later when the console silently renders nothing. Deliberately narrow: it parse-checks JSON/JSONL and the handshake envelope's required keys. Deep semantic validation belongs to project-registered CHECK steps, not to a per-write hook that runs under a timeout on every edit. The lead advisories (delegate, progress block) are skipped in a linked worktree (_lib.worktree_info), which is a worker, not the lead.","exists":true,"flows":[],"glyphs":[],"id":"hook.post-write-validate","kind":"code","layer":"GOVERN","package":null,"path":".claude/hooks/post-write-validate.sh","title":"Post Write Validate"},{"description":"ritual-ticket.sh - UserPromptSubmit + UserPromptExpansion hook. Mints the ritual ticket. The ritual (/project-memory) and the installer (/adopt) are the USER's to open. checkctl refuses to open, continue or complete a ritual run without a fresh ticket in .claude/state/ritual-ticket.json, and the policy gate denies that file to every agent identity on every write lane. This hook is its one writer: when the user's own prompt starts with /project-memory or /adopt (UserPromptSubmit `user_input`, `prompt` in older releases), or Claude Code expands one of those two commands (UserPromptExpansion `command_name`), it writes {skill, ts, session_id, event}. A prompt that merely mentions the command mid-sentence writes nothing, and neither does a turn Claude Code starts on its own. A tripwire, not cryptography: an agent-opened ritual fails loudly, and every issue lands in the record. It does not make forging impossible. NEVER blocks or alters the prompt: every path exits 0 and prints nothing (stdout on these two events would be injected into the context). If it breaks, no ticket is written and checkctl refuses the ritual: fail closed overall, through checkctl, never by blocking the user here. The payload goes to a temp FILE, as in policy-gate.sh: a prompt can be far larger than an environment variable may hold.","exists":true,"flows":[],"glyphs":[],"id":"hook.ritual-ticket","kind":"code","layer":"GOVERN","package":null,"path":".claude/hooks/ritual-ticket.sh","title":"Ritual Ticket"},{"description":"Lead-and-team routing in the fableous-orchestrated mode (.claude/protocols/orchestration.md).","exists":true,"flows":[],"glyphs":[],"id":"config.orchestration","kind":"data","layer":"GOVERN","package":null,"path":".claude/config/orchestration.json","title":"Orchestration"},{"description":"The lifecycle phases (plan -> build -> review -> deploy): what work each phase allows, and the check that must pass to leave it.","exists":true,"flows":[],"glyphs":[],"id":"config.phases","kind":"data","layer":"GOVERN","package":null,"path":".claude/config/phases.json","title":"Phases"},{"description":"Access policy enforced by hooks/policy-gate.sh (PreToolUse on Write|Edit|NotebookEdit|Bash).","exists":true,"flows":[],"glyphs":[],"id":"config.policy","kind":"data","layer":"GOVERN","package":null,"path":".claude/config/policy.json","title":"Policy"},{"description":"What distctl.py export may publish from .claude/ and .claude-iff/ into a clean public copy: an include list of globs that can only narrow a hard-coded floor (state, logs, lessons, status, tasks, research, the record surface, local settings and env files never export). Kits ship it empty.","exists":true,"flows":[],"glyphs":[],"id":"config.publish","kind":"data","layer":"GOVERN","package":null,"path":".claude/config/publish.json","title":"Publish"},{"description":"Evolution: how .claude changes. ## Principle `.claude` is a living system: the project teaches it what it needs.","exists":true,"flows":[],"glyphs":[],"id":"protocol.evolution","kind":"data","layer":"GOVERN","package":null,"path":".claude/protocols/evolution.md","title":"Evolution: how .claude changes"},{"description":"Handshake protocol: agent to agent contracts. How a spawning agent (the parent) and a subagent exchange work without losing information.","exists":true,"flows":[],"glyphs":[],"id":"protocol.handshake","kind":"data","layer":"GOVERN","package":null,"path":".claude/protocols/handshake.md","title":"Handshake protocol: agent to agent contracts"},{"description":"Honesty: the working agreement. The rest of `.claude/` assumes the information flowing through it is true: the Project log is only as good as the reports behind it, the retro can only fix friction it hears about, and the developer can only make good calls on accurate status.","exists":true,"flows":[],"glyphs":[],"id":"protocol.honesty","kind":"data","layer":"GOVERN","package":null,"path":".claude/protocols/honesty.md","title":"Honesty: the working agreement"},{"description":"Human gates: when to wait, when to proceed. You constantly face the choice: ask the human, or keep moving.","exists":true,"flows":[],"glyphs":[],"id":"protocol.human-gates","kind":"data","layer":"GOVERN","package":null,"path":".claude/protocols/human-gates.md","title":"Human gates: when to wait, when to proceed"},{"description":"Orchestration protocol: the lead and its team. How work is split in the `fableous-orchestrated` mode: the top model plans, designs and stays accountable; cheaper agents build and research; every handoff is a JSON envelope that is checked by code, not by trust.","exists":true,"flows":[],"glyphs":[],"id":"protocol.orchestration","kind":"data","layer":"GOVERN","package":null,"path":".claude/protocols/orchestration.md","title":"Orchestration protocol: the lead and its team"},{"description":"The recommended pattern: work with the agent in a private repo, publish releases to a public repo with distctl.py export. What the record is and why it never leaves, what visibility tracked vs ignored means for a team, the exact commands, and that the export never commits or pushes.","exists":true,"flows":[],"glyphs":[],"id":"reference.public-private","kind":"data","layer":"GOVERN","package":null,"path":".claude/reference/public-private.md","title":"Public and private"},{"description":"Where each kind of key belongs (tool keys in the env block of .claude/settings.local.json, MCP keys via claude mcp add --env or ${VAR} in .mcp.json), what never goes in git, and how the secrets_placement check and checkctl doctor enforce it.","exists":true,"flows":[],"glyphs":[],"id":"reference.secrets","kind":"data","layer":"GOVERN","package":null,"path":".claude/reference/secrets.md","title":"Secrets"},{"description":"Agent-to-agent Structured Return envelopes (stub at dispatch, envelope at delivery).","exists":true,"flows":[],"glyphs":["envelope"],"id":"store.handshakes","kind":"data","layer":"GOVERN","package":null,"path":".claude/state/handshakes","title":"Handshake envelopes"},{"description":"Async needs-human queue: SEV0-3 bands, queue-as-view. Bundles the append-only source (needs-human.jsonl) and its derived projection (needs-human.json).","exists":true,"flows":[],"glyphs":["append-only","derived"],"id":"store.needs_human","kind":"data","layer":"GOVERN","package":null,"path":".claude/state/needs-human.jsonl","title":"Needs-human queue"},{"description":"fableous-orchestrated runtime, per machine and gitignored: when each sub-agent began (the builder stop check's 'since'), the lead's code edits since the last dispatch (the delegation nudge), and when the periodic progress report last went to the lead (both organised modes). Written by the hooks only.","exists":true,"flows":[],"glyphs":[],"id":"store.orchestration","kind":"data","layer":"GOVERN","package":null,"path":".claude/state/orchestration.json","title":"Orchestration runtime"},{"description":"Ideas out of scope right now (statectl proposal add/list/resolve, ids PR-<n>): append-only, its own store like needs-human so a parked idea outlives any session. Open count lands in session.json; listed on the console WORK tab.","exists":true,"flows":[],"glyphs":["append-only"],"id":"store.proposals","kind":"data","layer":"GOVERN","package":null,"path":".claude/state/proposals.jsonl","title":"Proposal box"},{"description":"Proof the USER typed /project-memory or /adopt: {skill, ts, session_id, event}. Written by the prompt hook, or by `checkctl ticket --grant` that the human runs in their own terminal (the gate denies the file and that subcommand to every agent); checked by checkctl run and complete, consumed by complete. A tripwire, not cryptography "glyphs":[],"id":"tool.obsctl","kind":"code","layer":"OBSERVE","package":null,"path":".claude/tools/obsctl.py","title":"Obsctl"},{"description":"MAINTAINER-VERIFIED PRICES ONLY.","exists":true,"flows":[],"glyphs":[],"id":"config.model-prices","kind":"data","layer":"OBSERVE","package":null,"path":".claude/config/model-prices.json","title":"Model Prices"},{"description":"Observability settings.","exists":true,"flows":[],"glyphs":[],"id":"config.observe","kind":"data","layer":"OBSERVE","package":null,"path":".claude/config/observe.json","title":"Observe"},{"description":"SHA-256 chain over sealed segments; tamper evidence for the record.","exists":true,"flows":[],"glyphs":[],"id":"store.anchor","kind":"data","layer":"OBSERVE","package":null,"path":".claude-iff/obs/anchor.json","title":"Seal anchor"},{"description":"Liveness signal, overwritten once per turn by the Stop hook ('turn ended') and mid-turn by the activity pulse ('working', via the policy gate and the sub-agent capture lane, throttled by progress.pulse_seconds). Not the resume guarantee - the journal pointer is.","exists":true,"flows":[],"glyphs":[],"id":"store.heartbeat","kind":"data","layer":"OBSERVE","package":null,"path":".claude/state/heartbeat.json","title":"Heartbeat"},{"description":"RECORD_ROOT: raw capture, sealed raw, segments, transcripts, analysis, vault - sibling folder, out of git.","exists":true,"flows":[],"glyphs":["read-only"],"id":"store.record","kind":"data","layer":"OBSERVE","package":null,"path":null,"title":"Record root"},{"description":"Daily allowlisted totals only, committed in-repo (the iff test).","exists":true,"flows":[],"glyphs":["read-only"],"id":"store.rollups","kind":"data","layer":"OBSERVE","package":null,"path":".claude-iff/obs/rollups","title":"Daily rollups"},{"description":"Dual-clock narrative feed: operations & errors, anatomy evolution, data evolution.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.story","kind":"data","layer":"OBSERVE","package":null,"path":".claude/state/story-feed.json","title":"Story feed"},{"description":"console.py - hardened stdlib HTTP server for the console.","exists":true,"flows":[],"glyphs":[],"id":"console.server","kind":"code","layer":"CONSOLE","package":null,"path":".claude/console/console.py","title":"Console Server"},{"description":"consolectl.py - build the console payload, render it into console.html, delegate to the live server, or stop the server session-start launched (its pidfile lives in the record root) so the repo folder is free to delete or move.","exists":true,"flows":[],"glyphs":[],"id":"tool.consolectl","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/consolectl.py","title":"Consolectl"},{"description":"ctxmap.py - folder context: which guides and rules Claude Code loads for a file, and whether that context is healthy.","exists":true,"flows":[],"glyphs":[],"id":"tool.ctxmap","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/ctxmap.py","title":"Ctxmap"},{"description":"graphctl.py - the code graph: files, classes, functions and the edges between them.","exists":true,"flows":[],"glyphs":[],"id":"tool.graphctl","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/graphctl.py","title":"Graphctl"},{"description":"mapctl.py - the anatomy tool: scan stubs cards, lint checks the map, compile builds the node/edge map, context audits guides and rules, architecture renders the code graph, anatomy renders the docs site's interactive anatomy page (docs/anatomy.html: layers, one component, its file). cap_boxes marks a fold whose members are all lazy as lazy.","exists":true,"flows":[],"glyphs":[],"id":"tool.mapctl","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/mapctl.py","title":"Mapctl"},{"description":"progress.py - the progress model: one computation, three renderings.","exists":true,"flows":[],"glyphs":[],"id":"tool.progress","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/progress.py","title":"Progress"},{"description":"sysmon.py - optional system-monitor probes: CPU, RAM, GPU/VRAM.","exists":true,"flows":[],"glyphs":[],"id":"tool.sysmon","kind":"code","layer":"CONSOLE","package":null,"path":".claude/tools/sysmon.py","title":"Sysmon"},{"description":"Console serving.","exists":true,"flows":[],"glyphs":[],"id":"config.console","kind":"data","layer":"CONSOLE","package":null,"path":".claude/config/console.json","title":"Console"},{"description":"The anatomy page's HTML shell (the docs site's three-level map: layers, one component, its file) with one JSON token replaced by mapctl anatomy's payload at build time.","exists":true,"flows":[],"glyphs":[],"id":"console.anatomy-template","kind":"data","layer":"CONSOLE","package":null,"path":".claude/console/anatomy.template.html","title":"Anatomy Template"},{"description":"The console's single HTML shell (head, theme, styles, tabs) with one JSON token replaced by consolectl's payload at build time.","exists":true,"flows":[],"glyphs":[],"id":"console.template","kind":"data","layer":"CONSOLE","package":null,"path":".claude/console/console.template.html","title":"Console Template"},{"description":"Layer registry.","exists":true,"flows":[],"glyphs":[],"id":"map.layers","kind":"data","layer":"CONSOLE","package":null,"path":".claude/system-map/layers.json","title":"Map Layers"},{"description":"The architecture diagram's spec, one scope per diagram (groups, boxes, arrows), written by mapctl architecture with docs/ARCHITECTURE.md rendered from it.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.architecture","kind":"data","layer":"CONSOLE","package":null,"path":".claude/system-map/architecture.json","title":"Architecture spec"},{"description":"One JSON card per component; the system map's own source of truth.","exists":true,"flows":[],"glyphs":[],"id":"store.cards","kind":"data","layer":"CONSOLE","package":null,"path":".claude/system-map/cards","title":"Cards"},{"description":"The normalised code graph (files, classes, functions; contains, imports, calls), written by graphctl build from graphify's output under the record root or the stdlib walker. Gitignored: machine-local, rebuilt by the ritual, never shipped; mapctl architecture collapses it into the code scopes of the architecture spec.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.code_graph","kind":"data","layer":"CONSOLE","package":null,"path":".claude/system-map/code-graph.json","title":"Code graph"},{"description":"Compiled system map: nodes, edges, and lint results, rendered by the console MAP tab.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.map","kind":"data","layer":"CONSOLE","package":null,"path":".claude/system-map/map.json","title":"System map"},{"description":"The .claude anatomy expert. Use PROACTIVELY from /project-memory whenever a session added, removed, renamed or repurposed a component (anything under .claude/, a tool, a store, a hook, a skill, an agent), and from /adopt as the final install step. It keeps .claude/system-map/cards/ truthful, places components into layers, audits folder health, implements approved evolution changes with the right primitive, and proposes pruning. NOT a code reviewer and NOT a general refactorer.","exists":true,"flows":[],"glyphs":[],"id":"agent.anatomist","kind":"agent","layer":"EVOLVE","package":null,"path":".claude/agents/anatomist.md","title":"anatomist"},{"description":"End-of-session analyst invoked by the project-memory skill's EVOLVE step (soft gear). Receives a session digest plus the current .claude inventory and proposes only-necessary changes to the project's .claude system, including demotions and archivals, per .claude/protocols/evolution.md. Use PROACTIVELY only from project-memory, not a general reviewer of code, docs, or work products.","exists":true,"flows":[],"glyphs":[],"id":"agent.retro-analyst","kind":"agent","layer":"EVOLVE","package":null,"path":".claude/agents/retro-analyst.md","title":"retro-analyst"},{"description":"Install the dot-claude-iff system into a target project, or upgrade an already-installed one. Invoke on \"adopt this system into <path>\", \"set up my project like this\", \"install the claude system\", \"bootstrap .claude for <project>\", or \"/adopt --upgrade\" to bring an installed project's system up to date. A rare, high-blast-radius operation: runs only when the user explicitly asks for it. A Line endings (.gitattributes) step precedes the visibility step; the CLAUDE.template.md worker section says never open the ritual from a worktree and never stage or commit under the state folder.","exists":true,"flows":[],"glyphs":[],"id":"skill.adopt","kind":"code","layer":"EVOLVE","package":null,"path":".claude/skills/adopt/SKILL.md","title":"adopt"},{"description":"The one ritual - check, polish, publish, evolve, then route the next session (phase, mode, optional maturation pass). Only the user opens it, by typing /project-memory at the end of a working session or after a milestone. When the user says \"update memory\", \"log this session\", \"update the log\", \"curate memory\", \"update status\", \"wrap up\", or \"run the ritual\", ask them to type /project-memory. NOT for planning or resuming work (use /plan-task), and NOT for a cold \"where were we\" (read .claude/STATUS.md).","exists":true,"flows":[],"glyphs":[],"id":"skill.project-memory","kind":"code","layer":"EVOLVE","package":null,"path":".claude/skills/project-memory/SKILL.md","title":"project-memory"},{"description":"checkctl.py - the ritual runner: CHECK, POLISH, PUBLISH mechanics for /project-memory. In a linked worktree run/complete are refused; check_changelog_parity also checks CITATION.cff against the version (citation_version); DERIVED_STATE_IGNORED lists projections kept out of the dirty-tree test. The doctor has a gitattributes row: WARN when no eol=lf rule covers the hooks.","exists":true,"flows":[],"glyphs":[],"id":"tool.checkctl","kind":"code","layer":"EVOLVE","package":null,"path":".claude/tools/checkctl.py","title":"Checkctl"},{"description":"distctl.py - build the distribution zips, write the managed .gitignore block, and export a clean public copy. The managed ignore block ignores session.json, HANDOFF.md and needs-human.json; LEGAL_FILES (LICENSE, NOTICE) ship inside .claude/ of both kits. A GITATTRIBUTES constant (eol=lf rules) ships at both kits' roots, and the managed .gitignore block also ignores .cview/ in both visibilities.","exists":true,"flows":[],"glyphs":[],"id":"tool.distctl","kind":"code","layer":"EVOLVE","package":null,"path":".claude/tools/distctl.py","title":"Distctl"},{"description":"The knob registry: one card per tunable, so every setting is discoverable, typed and documented in one place - including every agent's model and effort pin, which would otherwise hide in frontmatter and drift.","exists":true,"flows":[],"glyphs":[],"id":"config.registry","kind":"data","layer":"EVOLVE","package":null,"path":".claude/config/registry.json","title":"Registry"},{"description":"The two release artifacts: dot-claude-iff-fresh.zip (new repo) and dot-claude-iff-adopt-kit.zip (existing repo). Derived: rebuilt by the ritual and by the release step; equal to a rebuild on main and on every tag, while between releases the copies on dev may lag. Never a builder's.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.dist","kind":"data","layer":"EVOLVE","package":null,"path":".claude/dist","title":"distribution zips"},{"description":"Law-1 anti-rot ledger: content hash of each generator's inputs/output, stamped after it runs through the ritual.","exists":true,"flows":[],"glyphs":["derived"],"id":"store.generators","kind":"data","layer":"EVOLVE","package":null,"path":".claude/state/generators.json","title":"Generator ledger"},{"description":"The /project-memory transaction: run id, phase, step, and who opened it (invoked_by: user-ticket, with the ticket's ts). PUBLISH refuses unless POLISH completed in the same run id.","exists":true,"flows":[] ing. Checklist item 7's 'nothing overwritten' expectation was not met as written; the outcome was green (doctor 15 ok, suite 955 passed) and transparent."},{"id":"PR-23","kind":"fix","note":"","source":"agent:lead","status":"open","text":"Five suite tests assume a fresh kit and fail on a customised adoption (extrct_private, 2026-11-08): test_contracts deny regex rejects Read(...) deny rules an adopter added; test_dist expects CREDITS/NOTICE at the repo root (an adopter with its own root LICENSE keeps the system's inside .claude/); test_ritual tagless-generator assumes project_steps empty; test_worktree real-worktree test assumes no policy.record_root override; test_context asserts the default guide size target instead of the configured knob. Fix: each test reads the config it depends on or scopes itself to kit files; the shipped suite must be green on any adoption that doctor passes."},{"id":"PR-24","kind":"feature","note":"","source":"agent:lead","status":"open","text":"CHECK gains a ci_status row: when gh is installed and the repo has an origin, read the latest workflow run for the current branch's head (gh run list --branch <b> --limit 1 --json conclusion,headSha) and WARN when it is failure or missing, OK when success, SKIP without gh/origin. Evidence: the Windows runner was red for four days and four pushes (2026-11-05..09) while STATUS and the beta criteria said CI was green; the human noticed, not the ritual. Telemetry-style: never FAIL (gh may be absent or offline)."},{"id":"PR-25","kind":"fix","note":"","source":"human","status":"open","text":"Alpha checklist: the human cannot see the session-start block before the first prompt. In the T21 verification run (2026-11-09) the tester started the fresh session and saw nothing before sending the first message; SessionStart hook stdout reaches the model's context and the transcript view, not the visible chat. The checklist defines 'session start' as 'the block Claude Code prints before your first prompt', so every ts run. Options: a knob in memory.json distribution (e.g. prerelease_is_latest: beta) read by release.yml, or a tag-message convention. Decide at the stable round; the stable tag moves Latest by itself either way."},{"id":"PR-13","kind":"feature","note":"Shipped early: Zenodo integration archived v0.3.0-beta.1 (concept DOI 10.5281/zenodo.24089281); the stable tag gets its version DOI automatically. The system report (docs/system-report.md) remains unwritten; file separately if still wanted.","source":"human","status":"planned","text":"Citable release: CITATION.cff plus Zenodo GitHub integration at the stable 0.3 tag (concept DOI), and a written system report (docs/system-report.md) describing the design of record for the archive"},{"id":"PR-28","kind":"fix","note":"overtaken 2026-11-09: dev was fast-forwarded into main, so the README prompt now clones the beta; revisit only if main lags dev again during a future pre-release period","source":"human","status":"rejected","text":"README adoption prompt clones the default branch (main), which is at v0.3.0-alpha.1 plus six commits while the beta lives on dev: an adopter following the README during the beta period gets alpha-era code. Until main is merged at the stable tag, the prompt should name the release (gh release download / the fresh zip for an empty repo, the adopt-kit zip for an existing one) or the tag to clone. Found 2026-11-09 setting up Rasad."},{"id":"PR-22","kind":"fix","note":"implemented in task 030b-t21-beta1-fix-round (beta.1 fix round, 2026-11-09)","source":"agent:lead","status":"planned","text":"mapctl.cap_boxes: the 'other' fold of planned (lazy) cards is emitted with _lazy: False, so an adopter with many planned cards (extrct_private: 99 planned library paths) gets the whole architecture spec blocked. A fold whose members are all lazy must be lazy (WARN, not error). Found and patched in extrct_private's upgrade 2026-11-08 (docs/system-arch/log/2026-11.md); port the fix here with a test in test_archit /* ---------------------------------------------------------------- small utilities */

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function (k) {
      const v = attrs[k];
      if (v === null || v === undefined) return;
      if (k === "class") node.className = v;
      else if (k === "dataset") Object.keys(v).forEach(function (dk) { node.dataset[dk] = v[dk]; });
      else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
  }
  (children || []).forEach(function (c) {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  });
  return node;
}

function svgEl(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
  return node;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function fmtNum(n) {
  if (n === null || n === undefined) return "-";
  return Number(n).toLocaleString("en-US");
}

function humanAge(seconds) {
  if (seconds === null || seconds === undefined) return "unknown";
  if (seconds < 5) return "just now";
  if (seconds < 60) return Math.floor(seconds) + " s ago";
  if (seconds < 3600) return Math.floor(seconds / 60) + " m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + " h ago";
  return Math.floor(seconds / 86400) + " d ago";
}

// A duration in the text block's own form (progress.fmt_duration): 45s, 12m, 3h05m, 2d03h.
function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return "?";
  const s = Math.max(0, Math.floor(seconds));
  const pad = function (n) { return (n < 10 ? "0" : "") + n; };
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h" + pad(m % 60) + "m";
  return Math.floor(h / 24) + "d" + pad(h % 24) + "h";
}

function parseTs(ts) {
  if (!ts) return null;
  const t = Date.parse(ts);
  return Number.isNaN(t) ? null : t;
}

function repoRootFromLocation() {
  // The payload deliberately carries no absolute path (a committed file must not embed a
  // machine's home directory). Under file:// this page lives at
  // <root>/.claude/console/console.html, so the root is our own path minus that suffix.
  if (location.protocol !== "file:") return "";
  const path = decodeURIComponent(location.pathname);
  const marker = "/.claude/console/";
  const at = path.lastIndexOf(marker);
  return at > 0 ? path.slice(0, at) : "";
}

function fileHref(relPath) {
  if (!relPath) return null;
  const root = repoRootFromLocation();
  if (!root) return null;
  const cleanRel = String(relPath).replace(/^\/+/, "");
  return "file://" + root + "/" + cleanRel;
}

// A real, clickable file:// link only WORKS when this page is itself open over file:// -
// browsers refuse to navigate an http(s) page to a file:// URL, silently, no error. console.py
// also does not serve arbitrary task/research/component files (only console/ plus the explicit
// read_allowlist), so under http(s) there is no href that would work either way. Render a real
// link in the one mode where it functions, and inert (but still readable) path text otherwise -
// never a link that looks clickable and quietly does nothing.
function pathLink(label, relPath, className) {
  if (!relPath) return el("span", { class: className }, [label]);
  if (location.protocol === "file:") {
    return el("a", { href: fileHref(relPath), class: className }, [label]);
  }
  return el("span", { class: className, title: relPath + " - open locally; not reachable over http" }, [label]);
}

// The editor jump: a vscode:// link hands the file to the editor the user already has, from
// any origin, so no server ever reads the repo. It needs the absolute root, which only the
// LIVE payload carries (a static build keeps project.root null on purpose), so it is offered
// only over http(s); under file: pathLink above already links the file itself.
function editorHref(relPath) {
  if (location.protocol !== "http:" && location.protocol !== "https:") return null;
  const root = DATA.project && DATA.project.root;
  if (!root || !relPath) return null;
  const abs = String(root).replace(/^\/+|\/+$/g, "") + "/" + String(relPath).replace(/^\/+/, "");
  return "vscode://file/" + encodeURI(abs);
}

function editorLink(relPath) {
  const href = editorHref(relPath);
  return href ? el("a", { href: href, class: "editor-link", title: "open in VS Code" }, ["open in editor"]) : null;
}

function copyText(text, btn) {
  function flash() {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = orig; }, 1200);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { fallbackCopy(text); flash(); });
      return;
    }
  } catch (e) { /* fall through to legacy path */ }
  try { fallbackCopy(text); flash(); } catch (e) { /* clipboard unavailable; the box still shows the text to select-copy */ }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } finally { document.body.removeChild(ta); }
}

function copyBox(commandText, note) {
  const code = el("code", {}, [commandText]);
  const btn = el("button", { type: "button", class: "copy-btn" }, ["Copy"]);
  btn.addEventListener("click", function () { copyText(commandText, btn); });
  const box = el("div", { class: "copy-box" }, [code, btn]);
  if (note) return el("div", {}, [box, el("div", { class: "copy-note" }, [note])]);
  return box;
}

// The human -> agent bridge: one click copies the prebuilt reply_template (context + what was
// asked + a trailing "My answer: "), the human pastes it into the terminal and types their
// answer, and the agent receives the full situation back instead of a bare "yes" it would have
// to re-anchor. The template text itself is built server-side (consolectl.py), never here.
function copyContextButton(item) {
  const btn = el("button", { type: "button", class: "copy-btn" }, ["Copy context"]);
  btn.addEventListener("click", function () { copyText(item.reply_template, btn); });
  return btn;
}

function kindChip(kind) {
  const cls = { agent: "chip-agent", code: "chip-code", data: "chip-data", human: "chip-human", external: "chip-external" }[kind] || "chip-external";
  return el("span", { class: "chip " + cls }, [kind || "external"]);
}

function kindColor(kind) {
  return {
    agent: "var(--color-agent)", code: "var(--color-code)", data: "var(--color-data)",
    human: "var(--color-human)", external: "var(--color-external)",
    folder: "var(--color-external)", file: "var(--color-code)"
  }[kind] || "var(--color-external)";
}

/* ---------------------------------------------------------------- freshness chips */

function freshnessChip(sectionKey) {
  const fr = DATA.freshness || { live: ["now"], ritual: [] };
  const isLive = (fr.live || []).indexOf(sectionKey) !== -1;
  if (isLive) return el("span", { class: "freshness-chip is-live" }, ["live"]);
  // A ritual-frozen section's own timestamp, never DATA.generated_at - in live mode that is
  // the POLL time, so it would tick every few seconds for data that has not actually moved,
  // which is precisely the freshness lie this chip exists to prevent. work.log_tail has no
  // reliable per-section timestamp in the payload at all, so it shows the label with none
  // invented rather than a misleading one.
  let ts = null;
  if (sectionKey === "tokens") ts = DATA.tokens && DATA.tokens.as_of;
  else if (sectionKey === "map") ts = DATA.map && DATA.map.generated_at;
  else if (sectionKey === "story") ts = DATA.story && DATA.story.generated_at;
  const label = ts ? ("as of last ritual · " + ts) : "as of last ritual";
  return el("span", { class: "freshness-chip", title: "updates only when /project-memory runs" }, [label]);
}

function sectionHead(title, sectionKey) {
  return el("h2", {}, [title, freshnessChip(sectionKey)]);
}

// One needs-human item: band chip, title, the humanized context and action, the copy-context
// bridge and the resolve command to copy. Shared by the Needs human card and the Progress
// panel's "Needs you" list, so the two render an item identically.
function appendNeedItem(card, item) {
  const band = String(item.band || "SEV3");
  const headRow = el("div", { class: "needs-human-row" }, [
    el("span", { class: "chip", style: "background:var(--" + band.toLowerCase() + "-bg);color:var(--" + band.toLowerCase() + "-fg);" }, [band]),
    el("span", { class: "title" }, [item.title || item.id]),
    el("span", { class: "mono", style: "font-size:11px;color:var(--text-dim);" }, [item.id + (item.category ? " · " + item.category : "")])
  ]);
  const itemWrap = el("div", { class: "nh-item" }, [headRow]);
  // "What's going on" / "What to do": full text, wrapped, never truncated - and skipped
  // cleanly (no empty line) for an older item that predates these fields.
  if (item.context) {
    itemWrap.appendChild(el("div", { class: "next-action" }, [el("span", { class: "k" }, ["What's going on: "]), item.context]));
  }
  if (item.action) {
    itemWrap.appendChild(el("div", { class: "next-action" }, [el("span", { class: "k" }, ["What to do: "]), item.action]));
  }
  if (item.reply_template) itemWrap.appendChild(el("div", { class: "nh-copy-row" }, [copyContextButton(item)]));
  card.appendChild(itemWrap);
  card.appendChild(copyBox('python3 .claude/tools/statectl.py need resolve ' + JSON.stringify(item.id), null));
}

// A progress bar: done of total, full (and green) only when done reaches total.
function progressBar(done, total, mini) {
  const pct = total ? Math.max(0, Math.min(100, Math.floor(100 * done / total))) : 0;
  const fill = el("div", { class: "pg-fill", style: "width:" + pct + "%;" });
  return el("div", { class: "pg-bar" + (mini ? " pg-mini" : "") + (total && done >= total ? " is-full" : ""),
                     title: done + " / " + total }, [fill]);
}

// The Progress panel: DATA.progress, the same model `statectl progress` prints and the periodic
// report hands the lead (tools/progress.py). Live with the rest of NOW; no timer of its own.
function renderProgress(panel) {
  const pg = DATA.progress;
  if (!pg) return;  // a payload from before the model existed: nothing to show, nothing invented
  const card = el("div", { class: "card", id: "progress-panel" }, [sectionHead("Progress", "progress")]);
  const last = pg.last_activity || {};
  const run = pg.run || {};
  const meta = [pg.mode_label || "Freestyle", "phase " + (pg.phase || "unset")];
  if (run.started) meta.push("run " + fmtDuration(run.elapsed));
  meta.push("last activity " + (last.ts ? fmtDuration(last.age) + " ago - " + last.note : "none recorded yet"));
  if (pg.empty || !pg.milestone) {
    card.appendChild(el("div", { class: "empty-state" }, [pg.empty || "nothing to measure yet"]));
    card.appendChild(el("div", { class: "pg-meta" }, [meta.join(" · ")]));
    panel.appendChild(card);
    return;
  }
  const t = pg.totals || {};
  card.appendChild(el("div", { class: "pg-head" }, [
    el("span", { class: "pg-mid" }, [pg.milestone.id]),
    el("span", { class: "pg-mtitle" }, [pg.milestone.title || ""])
  ]));
  card.appendChild(progressBar(t.checklist_done || 0, t.checklist_total || 0, false));
  card.appendChild(el("div", { class: "pg-figures" }, [
    el("span", { class: "pg-pct" }, [(t.percent || 0) + "%"]),
    el("span", { class: "pg-basis", title: t.basis || "" }, [
      "of plan items checked (" + (t.checklist_done || 0) + " / " + (t.checklist_total || 0) + ")"]),
    el("span", {}, [(t.tasks_done || 0) + " / " + (t.tasks_total || 0) + " tasks done"])
  ]));
  card.appendChild(el("div", { class: "pg-meta" }, [meta.join(" · ") + " · proposals open " + (pg.proposals_open || 0)]));

  [["in progress", "In progress"], ["waiting", "Waiting"], ["done", "Done"]].forEach(function (g) {
    const rows = (pg.tasks || []).filter(function (task) { return task.group === g[0]; });
    if (!rows.length) return;
    card.appendChild(el("div", { class: "pg-group" }, [g[1] + " (" + rows.length + ")"]));
    rows.forEach(function (task) {
      const total = task.checklist_total || 0;
      const done = task.status === "done" ? total : (task.checklist_done || 0);
      const row = el("div", { class: "pg-task" }, [
        el("span", { class: "pg-tid" }, [task.id]),
        pathLink(task.title || task.id, task.file, "pg-ttitle"),
        progressBar(task.status === "done" && !total ? 1 : done, total || 1, true),
        // A done task counts all its items (the percent's rule); the title keeps the file's ticks.
        el("span", { class: "pg-count", title: (task.checklist_done || 0) + " of " + total + " ticked in the task file" },
           [total ? done + "/" + total : "no list"]),
        el("span", { class: "status-pill status-" + String(task.status || "todo").toLowerCase() }, [task.status || "todo"])
      ]);
      const f = task.in_flight;
      if (f) {
        row.appendChild(el("span", { class: "pg-agent" }, [kindChip("agent"), " " + f.agent + " · " + fmtDuration(f.elapsed)
          + (f.worktree ? " · " + f.worktree : "")]));
      } else if (task.has_valid_envelope && task.status !== "done") {
        row.appendChild(el("div", { class: "pg-agent" }, [copyBox("python3 .claude/tools/checkctl.py handoff "
          + task.id + " --run", "handoff ready: review it (add --root <worktree> before the merge)")]));
      }
      card.appendChild(row);
    });
  });

  // -- needs you: the open needs-human items, rendered as on the Needs human card ----------
  const needs = pg.needs_human || [];
  if (needs.length) {
    card.appendChild(el("div", { class: "pg-group" }, ["Needs you (" + needs.length + ")"]));
    const full = {};
    ((DATA.now && DATA.now.needs_human && DATA.now.needs_human.top) || []).forEach(function (it) { full[it.id] = it; });
    needs.forEach(function (item) {
      appendNeedItem(card, full[item.id] || { id: item.id, title: item.title + " (" + fmtDuration(item.age) + " open)", band: item.band });
    });
  }

  // -- agents in flight: one line ------------------------------------------------------------
  const agents = pg.agents_in_flight || [];
  card.appendChild(el("div", { class: "pg-line" }, [
    el("span", { class: "k", style: "color:var(--text-dim);" }, ["agents in flight: "]),
    agents.length ? agents.map(function (a) { return a.agent + " " + a.task + " " + fmtDuration(a.elapsed); }).join(" · ") : "none"
  ]));
  panel.appendChild(card);
}

function renderNow() {

  renderProgress(panel);

  // -- heartbeat / resume pointer / phase --------------------------------------------------
  // A "working" heartbeat is the activity pulse mid-turn; any other note is the Stop hook's.
  const hbCard = el("div", { class: "card" }, [sectionHead("Heartbeat", "now")]);

  const beat = now.heartbeat || {};

    : (beat.note === "working" ? "working, last activity " + humanAge(now.heartbeat_age_seconds)

  hbCard.appendChild(el("div", { class: "kv-row" }, [el("span", { class: "k" }, ["session"]), el("span", { class: "v mono" }, [now.session_id || "-"])]));
  if (now.open_loops && now.open_loops.length) {

  const sevRow = el("div", { class: "sev-row" });
  ["SEV0", "SEV1", "SEV2", "SEV3"].forEach(function (band) {
    const n = (nh.by_band || {})[band] || 0;

    sevRow.appendChild(el("span", { class: cls }, [el("span", { class: "n" }, [String(n)]), " " + band]));

  if (nh.top && nh.top.length) {
    nhCard.appendChild(el("div", { class: "nh-hint" }, [
      "Copy an item's context, paste it in the Claude Code terminal, and type your answer "
      + "after 'My answer:' - the agent gets the full situation with your reply."
    ]));
    nh.top.forEach(function (item) { appendNeedItem(nhCard, item); });

  if (SYSMON.sample) {

  // -- tokens ------------------------------------------------------------------------------------

  // "in plan" (subscription billing) is a different truth than "unknown" (missing prices):
  // the first is not-applicable-by-design, the second is a gap the CHECK phase warns about.
  const costLine = tok.cost_known ? ("$" + Number(tok.cost_usd).toFixed(2))
    : (tok.billing === "subscription" ? "in plan" : "unknown");
  tokCard.appendChild(el("div", { class: "kv-row" }, [el("span", { class: "k" }, ["cost"]), el("span", { class: "v" }, [costLine])]));

  panel.appendChild(tokCard);
